<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tall Order">
<meta name="theme-color" content="#0f1620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0f1620;}
body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;}
html,body{position:fixed;inset:0;overflow:hidden;}
</style>
<title>Tall Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table chrome. A ledger bar across the top, the build palette down the left, the tower elevation fills the rest. One committed dark look. */
:root{
  color-scheme: dark;
  --ink:#0f1620;        /* page ground, blueprint night */
  --sheet:#17212d;      /* panels */
  --sheet2:#1f2b3a;     /* raised controls */
  --rule:#2c3b4e;       /* hairlines */
  --chalk:#e7edf3;      /* primary text */
  --pencil:#93a3b6;     /* secondary text */
  --brass:#e9b44c;      /* the one accent: brass elevator plates */
  --good:#58a6ff; --warn:#f0cf4a; --bad:#f06a5e; --cash:#86d993;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html{box-sizing:border-box;}
html,body{height:100%;overscroll-behavior:none;}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
textarea{-webkit-user-select:text;user-select:text;}
[hidden]{display:none!important;}
button{font:inherit;color:var(--chalk);background:var(--sheet2);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;cursor:pointer;touch-action:manipulation;}
button:hover{border-color:var(--pencil);}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px;}
button.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;}
button:disabled{opacity:.45;cursor:not-allowed;}
.spacer{flex:1;}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pencil);}
.dim{color:var(--pencil);}
.pos{color:var(--cash);} .negv{color:var(--bad);}
.m{font-family:var(--mono);}
.bar{height:8px;background:var(--sheet2);border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;}
.danger{border-color:#6d3631;color:#ffb3ab;}

#app{height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box;display:grid;grid-template-columns:236px 1fr;grid-template-rows:auto 1fr 30px;grid-template-areas:"top top" "rail stage" "tick tick";}

/* ---- top ledger ---- */
#top{grid-area:top;display:flex;align-items:center;gap:16px;padding:7px 14px;background:var(--sheet);border-bottom:1px solid var(--rule);min-width:0;}
.brand{font-family:var(--display);font-weight:800;font-size:25px;letter-spacing:.06em;line-height:1;display:flex;align-items:flex-end;white-space:nowrap;}
.brand i{display:inline-block;width:6px;height:21px;margin-left:7px;background:var(--brass);}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0;}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);white-space:nowrap;}
.stat .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.money{color:var(--cash);} .neg{color:var(--bad);}
.stat.clock{position:relative;padding-bottom:4px;}
.daytrack{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--sheet2);border-radius:1px;overflow:hidden;}
#dayBar{display:block;height:100%;width:0;background:var(--brass);}
.stars{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--brass);background:transparent;border-color:transparent;padding:2px 6px;white-space:nowrap;}
.speeds{display:flex;gap:2px;}
.speeds button{font-family:var(--mono);font-size:12px;padding:5px 7px;min-width:36px;}
#bOverlay{white-space:nowrap;}
#bSound{padding:6px 9px;line-height:1;}
#bSound.muted{color:var(--pencil);text-decoration:line-through;}
.railbtn{display:none;font-size:18px;line-height:1;padding:6px 10px;}

/* ---- build palette ---- */
#rail{grid-area:rail;display:flex;flex-direction:column;min-height:0;background:var(--sheet);border-right:1px solid var(--rule);}
#tools{flex:1;min-height:0;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:12px;}
.cat h3{margin:0 0 5px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);}
.cat .list{display:flex;flex-direction:column;gap:3px;}
.cat .list.two{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
.tb{display:grid;grid-template-columns:56px 1fr;grid-template-rows:auto auto;column-gap:9px;align-items:center;text-align:left;padding:4px 6px;background:transparent;border-color:transparent;}
.tb:hover{background:var(--sheet2);}
.tb .th{grid-row:1 / span 2;width:56px;height:28px;border-radius:2px;display:block;image-rendering:auto;}
.tb .n{font-size:13px;font-weight:500;line-height:1.15;align-self:end;}
.tb .c{font-family:var(--mono);font-size:11px;color:var(--pencil);align-self:start;}
.tb.plain{grid-template-columns:1fr auto;grid-template-rows:auto;padding:7px 8px;background:var(--sheet2);border-color:var(--rule);}
.tb.plain .n,.tb.plain .c{align-self:center;}
.tb.on{background:var(--sheet2);border-color:var(--brass);}
.tb.plain.on{background:var(--brass);color:var(--ink);}
.tb.plain.on .c{color:var(--ink);}
.tb.on .c{color:var(--brass);}
.tb.locked .n{color:var(--pencil);} .tb.locked .th{opacity:.35;filter:grayscale(1);}
#toolInfo{border-top:1px solid var(--rule);padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;min-height:96px;}
#toolInfo b{font-family:var(--display);font-size:17px;letter-spacing:.04em;}
#toolInfo .m{font-size:11px;color:var(--brass);line-height:1.4;}
#toolInfo p{margin:2px 0 0;font-size:12px;line-height:1.4;color:var(--pencil);}

/* ---- stage ---- */
#stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#tip{position:absolute;pointer-events:none;background:rgba(15,22,32,.94);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font-size:12px;max-width:250px;line-height:1.35;z-index:3;}
#tip b{font-weight:600;} #tip .m{color:var(--brass);} #tip .x{color:var(--bad);} #tip .h{color:var(--pencil);}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--sheet2);border:1px solid var(--brass);border-radius:4px;padding:7px 12px;font-size:13px;pointer-events:none;max-width:calc(100% - 32px);z-index:6;}
#legend{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(15,22,32,.88);border:1px solid var(--rule);border-radius:4px;padding:5px 9px;font-size:12px;pointer-events:none;max-width:calc(100% - 180px);}
#legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px;}
#legend i:first-child{margin-left:0;}
#goalCard{position:absolute;left:12px;bottom:12px;width:230px;display:flex;flex-direction:column;gap:3px;text-align:left;background:rgba(23,33,45,.94);border:1px solid var(--rule);border-radius:6px;padding:9px 11px;cursor:pointer;}
#goalCard:hover{border-color:var(--brass);}
#goalCard b{font-family:var(--display);font-size:18px;letter-spacing:.03em;line-height:1.1;}
#goalCard span{font-size:12px;line-height:1.35;color:var(--pencil);}
#goalCard .bar{height:5px;margin-top:4px;}
#mini{position:absolute;right:12px;bottom:12px;width:118px;height:150px;background:rgba(15,22,32,.82);border:1px solid var(--rule);border-radius:4px;cursor:pointer;touch-action:none;}
#zoomBtns{position:absolute;right:142px;bottom:12px;display:none;flex-direction:column;gap:6px;}
#zoomBtns button{width:44px;height:44px;font-size:22px;padding:0;background:rgba(31,43,58,.92);}
#confirm{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--brass);border-radius:8px;padding:6px 6px 6px 12px;max-width:calc(100% - 300px);box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:4;}
#confirm .cTxt{display:flex;flex-direction:column;min-width:0;}
#confirm b{font-size:13px;white-space:nowrap;}
#confirm span{font-family:var(--mono);font-size:12px;color:var(--cash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#confirm span.x{color:var(--bad);font-family:var(--body);white-space:normal;}
#confirm button{min-width:44px;height:44px;font-size:16px;}
#cYes{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;padding:0 16px;}
#cYes:disabled{background:var(--sheet2);color:var(--pencil);border-color:var(--rule);}
#cYes.danger{background:#a8423a;border-color:#a8423a;color:#fff;}

/* ---- inspector ---- */
#panel{position:absolute;right:12px;top:12px;width:300px;max-height:calc(100% - 24px);overflow-y:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:5;}
#panel h2{margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.03em;line-height:1.05;text-wrap:balance;padding-right:24px;}
#panel .sub{color:var(--pencil);font-size:12px;margin-top:2px;}
#panel .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
#panel .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
#panel p{margin:0;font-size:12.5px;line-height:1.45;color:var(--pencil);}
#panel p.alert,#modal p.alert{color:#ffc9c2;background:rgba(240,106,94,.12);border-left:3px solid var(--bad);padding:6px 8px;border-radius:2px;}
.x-close{position:absolute;right:8px;top:8px;padding:2px 8px;background:transparent;border-color:transparent;color:var(--pencil);font-size:18px;}
.why{display:flex;flex-direction:column;gap:2px;margin-top:6px;font-size:12px;color:var(--pencil);}
.why div{display:flex;justify-content:space-between;gap:10px;}
.why span:last-child{font-family:var(--mono);}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px;}
.seg.three{grid-template-columns:repeat(3,1fr);}
.seg button{font-size:11px;padding:5px 2px;}
.stops{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:3px;}
.stops button{font-family:var(--mono);font-size:10.5px;padding:4px 0;}
#panel .btnrow{margin-top:3px;}

/* ---- ticker, menu ---- */
#ticker{grid-area:tick;background:var(--sheet);border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:12.5px;overflow:hidden;white-space:nowrap;cursor:pointer;}
#ticker .t{font-family:var(--mono);color:var(--pencil);font-size:11px;}
#ticker.good #tickMsg{color:var(--cash);} #ticker.bad #tickMsg{color:var(--bad);} #ticker.warn #tickMsg{color:var(--warn);}
#tickMsg{overflow:hidden;text-overflow:ellipsis;}
#menu{position:absolute;right:12px;top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:210px;max-height:calc(100% - 24px);overflow-y:auto;z-index:7;box-shadow:0 8px 30px rgba(0,0,0,.35);}
#menu button{text-align:left;}

/* ---- modal ---- */
#modal{position:fixed;inset:0;background:rgba(5,9,14,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;}
#modal .card{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;max-width:580px;width:100%;max-height:calc(100% - 8px);overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:11px;}
#modal .card.wide{max-width:780px;}
#modal h1{margin:0;font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:.04em;line-height:1;}
#modal h4{margin:6px 0 0;font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);}
#modal p,#modal li{margin:0;font-size:14px;line-height:1.5;max-width:68ch;}
#modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;}
#modal kbd{font-family:var(--mono);font-size:12px;background:var(--sheet2);border:1px solid var(--rule);border-radius:3px;padding:0 4px;}
#modal textarea{width:100%;min-height:120px;background:var(--ink);color:var(--chalk);border:1px solid var(--rule);border-radius:4px;font-family:var(--mono);font-size:11px;padding:8px;box-sizing:border-box;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:10px;}
.tabs button{padding:5px 11px;font-size:13px;}
.tabs .x-btn{background:transparent;border-color:transparent;color:var(--pencil);font-size:20px;padding:0 8px;}
.reqs{display:flex;flex-direction:column;gap:3px;}
.req{display:flex;gap:8px;font-size:14px;align-items:baseline;}
.req .ok{color:var(--cash);} .req .no{color:var(--pencil);}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:4px;}
.charts>div{min-width:0;}
.charts canvas{display:block;width:100%;height:92px;margin-top:3px;background:rgba(15,22,32,.5);border-radius:4px;}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.goal{display:flex;flex-direction:column;gap:3px;border:1px solid var(--rule);border-radius:5px;padding:8px 10px;font-size:12.5px;color:var(--pencil);min-width:0;}
.goal .gt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;}
.goal b{color:var(--chalk);font-size:14px;} .goal .m{color:var(--brass);font-size:12px;}
.goal.done{opacity:.6;} .goal.done b{color:var(--cash);}
.goal .bar{height:5px;margin-top:3px;}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 22px;}
.cols>div{min-width:0;}
#modal table{border-collapse:collapse;width:100%;font-size:13px;}
#modal th{text-align:left;font-weight:500;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--pencil);padding:4px 6px 4px 0;}
#modal td{padding:4px 6px 4px 0;border-top:1px solid var(--rule);font-variant-numeric:tabular-nums;}
#modal td:not(:first-child),#modal th:not(:first-child){text-align:right;font-family:var(--mono);}
.list2{display:flex;flex-direction:column;gap:4px;}
.list2 button{display:grid;grid-template-columns:64px 1fr;gap:1px 10px;text-align:left;padding:7px 10px;}
.list2 button b{grid-row:1 / span 2;font-family:var(--mono);font-size:15px;align-self:center;}
.list2 button span{font-size:13px;min-width:0;}
.list2 button .dim{font-size:12px;}
.log{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--pencil);}
.log .t{font-family:var(--mono);font-size:11px;margin-right:8px;}
.log .good{color:var(--cash);} .log .bad{color:var(--bad);} .log .warn{color:var(--warn);}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.choices.three{grid-template-columns:repeat(3,1fr);}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;padding:9px 11px;font-weight:400;}
.choice b{font-size:14px;} .choice span{font-size:12px;line-height:1.35;color:var(--pencil);}
.choice.on span{color:#3a2e12;}

#rotate{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
#rotate div{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:280px;}
#rotate b{font-family:var(--display);font-size:30px;letter-spacing:.04em;line-height:1.05;}
#rotate span{color:var(--pencil);font-size:14px;}

/* ---- narrower desktop windows ---- */
@media (max-width:1180px){ .brand{display:none;} #top{gap:12px;} }
@media (max-width:980px){ .stat.rate{display:none;} #app{grid-template-columns:200px 1fr;} }
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 26px;grid-template-areas:"top" "stage" "rail" "tick";}
  #top{gap:8px;padding:6px 10px;flex-wrap:wrap;}
  .stat.pop{display:none;}
  #rail{border-right:none;border-top:1px solid var(--rule);}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px 10px;gap:14px;max-height:112px;}
  .cat{flex:none;} .cat .list{flex-direction:row;} .cat .list.two{display:flex;}
  .tb{min-width:150px;}
  #toolInfo{display:none;}
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:60%;}
  #mini{display:none;} #goalCard{width:190px;}
  .charts,.goals,.cols{grid-template-columns:1fr;}
  .choices.three{grid-template-columns:1fr;}
}

/* ---- touch ---- */
@media (pointer:coarse){
  #zoomBtns{display:flex;}
  .tb{padding:6px;}
}
/* phones held sideways */
@media (pointer:coarse) and (orientation:landscape) and (max-height:540px){
  #app{grid-template-columns:168px 1fr;grid-template-rows:auto 1fr 22px;grid-template-areas:"top top" "rail stage" "tick tick";}
  #app.norail{grid-template-columns:0 1fr;}
  #app.norail #rail{visibility:hidden;border:0;}
  .railbtn{display:block;}
  .brand,.stat.pop,.stat.rate,#bReports{display:none;}
  #top{gap:8px;padding:4px 8px;flex-wrap:nowrap;}
  .stat .k{font-size:9px;letter-spacing:.04em;}
  .stat .v{font-size:13px;}
  .stars{font-size:15px;padding:2px;}
  #top button{padding:5px 7px;}
  .speeds button{min-width:30px;padding:5px 3px;font-size:11px;}
  #bOverlay{max-width:92px;overflow:hidden;text-overflow:ellipsis;font-size:12px;}
  #rail{border-right:1px solid var(--rule);border-top:0;}
  #tools{flex-direction:column;overflow-y:auto;overflow-x:hidden;max-height:none;padding:6px 6px 14px;gap:8px;}
  .cat .list{flex-direction:column;} .cat .list.two{display:grid;}
  .cat h3{font-size:11px;margin-bottom:2px;}
  .tb{min-width:0;grid-template-columns:44px 1fr;column-gap:7px;padding:5px;}
  .tb .th{width:44px;height:22px;}
  .tb .n{font-size:12px;} .tb .c{font-size:10px;}
  .tb.plain{padding:7px 5px;} .tb.plain .c{display:none;}
  #toolInfo{display:none;}
  #panel{left:auto;top:6px;bottom:6px;right:6px;width:262px;max-height:none;padding:12px;gap:8px;}
  #panel h2{font-size:20px;}
  #ticker{font-size:11.5px;padding:0 10px;}
  #goalCard{left:8px;bottom:8px;width:168px;padding:6px 8px;}
  #goalCard b{font-size:14px;} #goalCard span{display:none;}
  #mini{display:block;right:8px;top:8px;bottom:auto;width:66px;height:84px;}
  #zoomBtns{right:8px;bottom:8px;}
  #zoomBtns button{width:40px;height:40px;}
  #confirm{bottom:8px;max-width:calc(100% - 250px);}
  #toast{font-size:12px;padding:5px 10px;max-width:60%;}
  #legend{left:8px;top:8px;font-size:11px;max-width:calc(100% - 100px);}
  #modal{padding:8px;}
  #modal .card{padding:14px 16px;gap:8px;}
  #modal h1{font-size:28px;}
  #modal p,#modal li{font-size:13px;}
  .charts canvas{height:70px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

</head>
<body>
<div id="app">
  <header id="top">
    <button id="bRail" class="railbtn" aria-label="Show or hide the build menu">☰</button>
    <div class="brand">TALL ORDER<i></i></div>
    <div class="stat"><span class="k" id="sLoan">Funds</span><span id="sMoney" class="v money">$0</span></div>
    <div class="stat clock"><span class="k" id="sDate">Y1 Q1</span><span id="sClock" class="v">06:00</span><span class="daytrack"><i id="dayBar"></i></span></div>
    <div class="stat pop"><span class="k">People</span><span id="sPop" class="v">0</span></div>
    <div class="stat rate"><span class="k">Rating</span><span id="sRate" class="v">–</span></div>

// Tall Order 2 — core constants and helpers (no DOM in the sim files 00–80)
// ============================================================================
const VERSION = 2;
const W = 8, H = 32;                 // world units per column / per floor
const COLS = 240;                    // lot width in columns
const MINF = -10, MAXF = 99;         // internal floor index: 0 is shown as "1F", -1 as "B1"
const NF = MAXF - MINF + 1;
const STEP = 5;                      // game seconds per simulation step
const HR = 3600, DAY = 86400;
const MAXP = 9000;                   // cap on people in transit at once
const FI = f => f - MINF;

// sky lobbies land on shown floors 15, 30, 45, 60, 75, 90 and a luxury lobby on 99
const SKY_LOBBIES = [14, 29, 44, 59, 74, 89, 98];
const isSkyLobby = f => SKY_LOBBIES.includes(f);
const lobbyFloor = f => f === 0 || isSkyLobby(f);
const expressFloor = f => f <= 0 || isSkyLobby(f);

// build limits by star level (index = stars; 6 = Landmark)
const MAXFLOOR = [0, 14, 29, 49, 74, 99, 99];
const MINFLOOR = [0, -1, -3, -6, -10, -10, -10];

// ---- seeded random numbers for the simulation (visual-only code uses Math.random) ----
let RSEED = 12345;
function rnd() {
  RSEED = (RSEED + 0x6D2B79F5) | 0;
  let t = RSEED;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = arr => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
// cheap deterministic hash → 0..1, for stable visual variation
function hash01(a, b) {
  let h = (a * 374761393 + (b | 0) * 668265263) | 0;
  h = (h ^ (h >>> 13)) * 1274126177 | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// ---- formatting ----
const fmt = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
function fmtK(n) {
  const a = Math.abs(n);
  const s = a >= 1e6 ? (a / 1e6).toFixed(a % 1e6 ? (a % 1e5 ? 2 : 1) : 0) + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'K' : String(Math.round(a));
  return (n < 0 ? '−$' : '$') + s;
}
const fname = f => f >= 0 ? (f + 1) + 'F' : 'B' + (-f);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// ---- calendar: a week is 3 days (2 weekdays + 1 weekend), a quarter is one week, a year is 4 quarters ----
const dayOf = t => Math.floor(t / DAY);
const tod = t => t % DAY;
const isWeekend = day => day % 3 === 2;
const quarterOf = day => Math.floor(day / 3) % 4;          // 0..3
const yearOf = day => Math.floor(day / 12) + 1;
const SEASONS = ['Winter', 'Spring', 'Summer', 'Autumn'];
const qLabel = day => `Year ${yearOf(day)} Q${quarterOf(day) + 1}`;
function clock(t) {
  const s = tod(t), h = Math.floor(s / HR), m = Math.floor(s % HR / 60);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

// ---- binary heap keyed on .t ----
class Heap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  peek() { return this.a[0]; }
  push(e) {
    const a = this.a; a.push(e); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p].t <= a[i].t) break; const x = a[p]; a[p] = a[i]; a[i] = x; i = p; }
  }
  pop() {
    const a = this.a, top = a[0], last = a.pop();
    if (a.length) {
      a[0] = last; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l].t < a[m].t) m = l;
        if (r < a.length && a[r].t < a[m].t) m = r;
        if (m === i) break;
        const x = a[m]; a[m] = a[i]; a[i] = x; i = m;
      }
    }
    return top;
  }
}

// ---- event bus: the sim announces things, the interface (sound, effects, news) listens ----
const listeners = [];
function on(fn) { listeners.push(fn); }
function emit(type, data) { for (let i = 0; i < listeners.length; i++) listeners[i](type, data); }

// ============================================================================

  gym: { name: 'Gym', cat: 'Leisure', w: 18, cost: 150000, star: 2, comm: 'gym', pop: 4, rent: [16000, 12000, 8500, 5500], need: 10, minPop: 200, build: 4,

  metro: { name: 'Metro Station', cat: 'Landmarks', w: 30, h: 2, cost: 1000000, star: 4, basement: true, upkeep: 45000, build: 12, noise: 2,
    desc: 'Basement only. A second way in: more visitors, and commuters who skip the lobby.' },

    desc: '90F or higher. The crown that earns Landmark status.' }
};
const CATS = ['Structure', 'Transit', 'Rentals', 'Hotel', 'Retail', 'Leisure', 'Services', 'Landmarks'];

const RENT_NAMES = ['High', 'Normal', 'Low', 'Very low'];
const RENT_ADJ = [-14, 0, 8, 14];            // rating points for price level
const RENT_DEMAND = [0.4, 0.75, 1.0, 1.25];  // how quickly vacancies fill at each level

// requirements for each star level (6 = Landmark)
const REQ = {
  2: { pop: 300 },
  3: { pop: 1000, has: ['security'], rating: 55 },
  4: { pop: 2500, has: ['medical', 'recycling', 'suite'], rating: 60 },
  5: { pop: 5000, has: ['metro', 'cinema'], rating: 60, critic: true },
  6: { pop: 8000, has: ['skygarden', 'penthouse'], rating: 65, height: 89 }
};

const DIFFS = {
  easy:   { name: 'Relaxed',  money: 3000000, rent: 1.15, stress: 0.8, desc: 'More cash, patient tenants.' },
  normal: { name: 'Standard', money: 2000000, rent: 1.0,  stress: 1.0, desc: 'The intended challenge.' },
  hard:   { name: 'Tight',    money: 1200000, rent: 0.9,  stress: 1.25, desc: 'Less cash, lower rents, short tempers.' }
};

const isRentalDef = d => !!(d.rent || d.sale);
const hOfDef = d => d.h || 1;

// ============================================================================
// Game state (S, saved) and runtime structures (R, rebuilt on load)
// ============================================================================
let S = null, R = null;

function emptyQuarter() {
  return { rent: 0, hotel: 0, sales: 0, tickets: 0, bonus: 0, build: 0, upkeep: 0, refund: 0, interest: 0, repair: 0 };
}

function newState(opts) {
  opts = opts || {};
  const diff = DIFFS[opts.diff] ? opts.diff : 'normal';
  return {
    v: VERSION,
    seed: opts.seed || ((Date.now() ^ (Math.random() * 1e9)) | 0) || 1,
    money: DIFFS[diff].money,
    time: 6 * HR,                 // day 0, 06:00
    star: 1,
    units: [],
    nextId: 1,
    diff,
    sandbox: !!opts.sandbox,
    cfg: { fires: true },
    loan: 0,
    q: emptyQuarter(),            // running totals for the current quarter
    qHist: [],                    // closed quarters, newest last
    hist: [],                     // one row per day: {d,pop,money,rating,wait}
    goals: {},                    // goal id -> day completed
    flags: {},                    // sticky achievements used by goals
    conv: -1,                     // week index of a convention, if any
    critic: { state: 'none', day: -99, result: null, passed: false },
    weather: { day: -1, kind: 'clear' },
    stats: { tickets: 0, built: 0 }
  };
}

function initRuntime() {
  R = {
    grid: [], egrid: [], tile: [], seg: [],
    segFloor: [0], segCount: 0,
    adj: [[], []], reach: [new Set(), new Set()], cache: new Map(),
    people: [], heap: new Heap(), shaft: new Map(), byId: new Map(),
    dirty: true, pid: 1,
    pop: 0, entrances: [], lobbySegs: [], comm: {}, venues: [], metros: [], parkings: [],
    am: {}, svcPenalty: 0, parkCover: 0, parkFree: 0,
    day: { boards: 0, waitSum: 0, trips: 0, bookedPeak: 0, deckTickets: 0 },
    log: [], hourTick: 0
  };
  for (let i = 0; i < NF; i++) {
    R.grid.push(new Int32Array(COLS));
    R.egrid.push(new Int32Array(COLS));
    R.tile.push(new Uint8Array(COLS));
    R.seg.push(new Int32Array(COLS));
  }
}

// ---- grid access ----
const inb = (f, c) => f >= MINF && f <= MAXF && c >= 0 && c < COLS;
const tileAt = (f, c) => inb(f, c) ? R.tile[FI(f)][c] : 0;
const gridAt = (f, c) => inb(f, c) ? R.grid[FI(f)][c] : 0;
const egridAt = (f, c) => inb(f, c) ? R.egrid[FI(f)][c] : 0;
const segAt = (f, c) => inb(f, c) ? R.seg[FI(f)][c] : 0;
const defOf = u => DEFS[u.type];
const isElev = u => DEFS[u.type].transit === 'elev';
const isTransit = u => !!DEFS[u.type].transit;
const gridOf = u => isTransit(u) ? R.egrid : R.grid;
const unitAt = (f, c) => R.byId.get(egridAt(f, c)) || R.byId.get(gridAt(f, c));
const roomAt = (f, c) => R.byId.get(gridAt(f, c));
const alive = u => !!u && R.byId.get(u.id) === u;
const built = u => S.time >= (u.ready || 0);
const center = u => ({ f: u.f, c: u.col + (u.w >> 1) });
const isRental = u => isRentalDef(DEFS[u.type]);
const usable = u => alive(u) && built(u) && !u._unreach && !u._fire;
const open = u => usable(u) && (u.occ || !isRental(u));

// ---- money ----
function earn(amt, kind, u) {
  if (!amt) return;
  S.money += amt;
  S.q[kind] = (S.q[kind] || 0) + amt;
  emit('money', { amt, kind, u });
}
function spend(amt, kind) {
  if (S.sandbox && kind === 'build') return;
  S.money -= amt;
  S.q[kind] = (S.q[kind] || 0) + amt;
}
const canAfford = amt => S.sandbox || S.money >= amt;
function notice(text, kind, u) {
  const n = { text, kind: kind || '', uid: u ? u.id : 0, t: S.time };
  R.log.unshift(n);
  if (R.log.length > 60) R.log.pop();
  emit('notice', n);
}

// ---- registry ----
function newCar(u, i) {
  return { f: u.f, dir: 0, prog: 0, pos: u.f, ppos: u.f, pax: [], dwell: 0, assign: new Set(), idle: 0, broken: 0, lane: i % 2, doors: 0 };
}
function register(u) {
  R.byId.set(u.id, u);
  const g = gridOf(u);
  for (let f = u.f; f < u.f + u.h; f++) {
    const row = g[FI(f)], t = R.tile[FI(f)];
    for (let c = u.col; c < u.col + u.w; c++) { row[c] = u.id; if (!t[c]) t[c] = 1; }
  }
  if (isElev(u)) {
    const cars = [];
    for (let i = 0; i < u.cars; i++) cars.push(newCar(u, i));
    R.shaft.set(u.id, { q: new Map(), cars, boards: 0, waitSum: 0, maxWait: 0 });
  }
  R.dirty = true;
}
function unregister(u) {
  const g = gridOf(u);
  for (let f = u.f; f < u.f + u.h; f++) {
    const row = g[FI(f)];
    for (let c = u.col; c < u.col + u.w; c++) if (row[c] === u.id) row[c] = 0;
  }
  R.byId.delete(u.id);
  const rt = R.shaft.get(u.id);
  if (rt) {
    for (const car of rt.cars) for (const p of car.pax) { p.f = car.f; p.st = 'walk'; p.needReroute = true; }
    for (const q of rt.q.values()) for (const p of q.u.concat(q.d)) { p.st = 'walk'; p.qarr = null; p.needReroute = true; }
    R.shaft.delete(u.id);
  }
  R.dirty = true;
}
function removeUnit(u, why) {
  const i = S.units.indexOf(u);
  if (i < 0) return;
  // a sold condo that is demolished refunds its owners
  if (u.occ && u.paid && why !== 'fire') { S.money -= u.paid; S.q.refund += u.paid; }
  S.units.splice(i, 1);
  unregister(u);
  emit('removed', { u, why });
}

// ---- save / load ----
function serialize() {
  const tiles = {};
  for (let f = MINF; f <= MAXF; f++) {
    const t = R.tile[FI(f)];
    let any = false;
    for (let c = 0; c < COLS; c++) if (t[c]) { any = true; break; }
    if (!any) continue;
    const runs = []; let c = 0;
    while (c < COLS) { const v = t[c]; let n = 1; while (c + n < COLS && t[c + n] === v) n++; runs.push(v, n); c += n; }

// ============================================================================
// Walkable segments, transit links and route finding

  R.comm = {}; for (const k of COMM_CATS) R.comm[k] = [];

  for (const u of S.units) {
    const d = DEFS[u.type];
    if (d.comm) R.comm[d.comm].push(u);
    if (d.venue) R.venues.push(u);
    if (u.type === 'metro' && built(u)) R.metros.push(u);
    if (u.type === 'parking' && built(u)) R.parkings.push(u);
  }

  // 5. what can be reached from the front doors (and the metro)
  for (const g of [0, 1]) {

    for (const m of R.metros) { const s = segAt(m.f, m.col + (m.w >> 1)); if (s) st.push(s); }

// ============================================================================
// People: every trip in the tower is a real walk, ride and wait

// ============================================================================
// Daily life: who goes where and when

function at(t, fn) { if (t >= S.time) R.heap.push({ t, fn }); }

// ---------------------------------------------------------------- offices
function schedOffice(u, base) {

// ---------------------------------------------------------------- condos and penthouses

// ---------------------------------------------------------------- housekeeping

    if (u._nohk && S.time - u._nohk < 3 * HR) continue;

}

// ---------------------------------------------------------------- visitors from outside

    }

  const len = (d.venue === 'cinema' ? 2 : 3) * HR;
  for (const sh of shows) {

    const n = Math.min(d.capacity, Math.round(draw * (we ? 1.4 : 1) * rr(0.7, 1.2) * appeal));

// ---------------------------------------------------------------- the day

  else if (q === 1) kind = r < 0.3 ? 'rain' : r < 0.45 ? 'overcast' : 'clear';
  else if (q === 2) kind = r < 0.12 ? 'rain' : 'clear';

  }
  for (const u of S.units.filter(x => x.infest)) {
    for (const c of [u.col - 1, u.col + u.w]) {
      const n = roomAt(u.f, c);
      if (n && DEFS[n.type].hotel && !n.infest && !n._booked && rnd() < 0.3) { n.infest = true; n.dirty = true; n.dirtyDay = n.dirtyDay ?? day; }
    }
  }
}
function dayEnd(day) {
  for (const u of S.units) {
    const d = DEFS[u.type];
    if (d.comm && u.occ && built(u) && (u.openDay ?? 0) < day) u.custAvg = (u.custAvg ?? d.need) * 0.6 + (u._cust || 0) * 0.4;
    u._custY = u._cust || 0;
  }
  const wait = R.day.boards ? R.day.waitSum / R.day.boards : 0;
  computeTower();
  const rating = avgRating();
  S.hist.push({ d: day, pop: R.pop, money: Math.round(S.money), rating: Math.round(rating), wait: Math.round(wait) });
  if (S.hist.length > 60) S.hist.shift();
  if (!isWeekend(day) && R.pop >= 300 && R.day.boards > 200 && wait < 60) S.flags.calmDay = true;
  R.day.lastWait = wait;
  for (const [id, rt] of R.shaft) {
    const u = R.byId.get(id);
    if (u) { u.yBoards = rt.boards; u.yWait = rt.boards ? Math.round(rt.waitSum / rt.boards) : 0; u.yMax = Math.round(rt.maxWait); }
    rt.boards = 0; rt.waitSum = 0; rt.maxWait = 0;
  }
  checkGoals();
  fillVacancies();
  if (day % 3 === 2) quarterEnd(day);
  for (const u of S.units) { u._cust = 0; if (DEFS[u.type].comm) u._here = 0; }
  emit('autosave', {});
}

// ---------------------------------------------------------------- stepping
function simStep() {
  S.time += STEP;
  const h = R.heap;
  while (h.size && h.peek().t <= S.time) { const e = h.pop(); e.fn(); }
  if (R.dirty) rebuildGraph();
  for (const [id, rt] of R.shaft) { const u = R.byId.get(id); if (u) shaftStep(u, rt); }
  const P = R.people;
  for (let i = 0; i < P.length; i++) { const p = P[i]; if (!p.done) personStep(p); }
  if (S.time % 60 === 0) { let j = 0; for (let i = 0; i < P.length; i++) if (!P[i].done) P[j++] = P[i]; P.length = j; }
}

// ---- tower-wide facts, refreshed hourly and whenever the layout changes ----
function computeTower() {
  let pop = 0, need = 0, bays = 0;
  const has = {};
  const am = { coffee: false, food: false, dine: false, shop: false, bar: false, gym: false };
  for (const u of S.units) {
    const d = DEFS[u.type];
    if (!built(u)) continue;
    const live = !u._unreach;
    if (d.pop && live && (u.occ || !isRental(u))) pop += d.pop;
    if (d.hotel && u._booked) pop += d.guests;
    if (u.type === 'office' && u.occ) need += 2;
    if (d.sale && u.occ) need += u.type === 'penthouse' ? 2 : 1;
    if (u.type === 'parking' && live) bays++;
    if (live && (u.occ || !isRental(u))) { has[u.type] = (has[u.type] || 0) + 1; if (d.comm) am[d.comm] = true; }
  }
  R.pop = pop; R.has = has; R.am = am; R.bays = bays;
  R.parkCover = need ? Math.min(1, bays / need) : (bays ? 1 : 0);
  const pen = [];
  if (pop >= 600 && !has.security) pen.push(['No security office', 4]);
  if (pop >= 1500 && !has.medical) pen.push(['No clinic', 6]);
  if (pop >= 2500 && !has.recycling) pen.push(['Trash piling up', 8]);
  R.svc = pen;
  R.svcPenalty = pen.reduce((s, p) => s + p[1], 0);
}

// ---- one unit's rating, with the reasons behind it ----
function rateUnit(u) {
  if (u._rate && u._rateT === R.hourTick && !R.dirty) return u._rate;
  const d = DEFS[u.type], parts = [];
  let v;
  if (u._unreach) { v = 0; parts.push(['No route from the lobby', -100]); }
  else {
    const travel = u.travel ?? 75;
    v = 26 + 0.65 * travel;
    parts.push(['Getting around', Math.round(0.65 * (travel - 75))]);
    if (d.rent || d.sale || d.nightly) { const a = RENT_ADJ[u.level ?? 1]; if (a) parts.push([a > 0 ? 'Good price' : 'High price', a]); v += a; }
    if (u._noise > 0.5) { const n = Math.round(u._noise); parts.push([u._noiseBy ? `Noise (${DEFS[u._noiseBy].name.toLowerCase()} nearby)` : 'Noise', -n]); v -= n; }
    let am = 0;
    const A = R.am, add = (ok, label, pts) => { if (ok) { am += pts; } };
    if (u.type === 'office') { add(A.food || A.coffee || A.dine, 'food', 4); add(A.coffee, 'coffee', 2); add(A.gym, 'gym', 2); am += Math.round(R.parkCover * 6); }
    else if (d.sale) { add(A.shop, 'shop', 3); add(A.food || A.dine, 'food', 2); add(A.gym, 'gym', 3); am += Math.round(R.parkCover * 6); }
    else if (d.hotel) { add(A.dine, 'dine', 4); add(A.bar, 'bar', 2); add(A.gym, 'gym', 2); add(A.coffee, 'coffee', 1); }
    if (am) { parts.push(['Amenities in the tower', am]); v += am; }
    if (R.svcPenalty && (d.rent || d.sale || d.hotel)) { for (const s of R.svc) parts.push([s[0], -s[1]]); v -= R.svcPenalty; }
    if (d.hotel && u.infest) { parts.push(['Pests', -30]); v -= 30; }
    if (d.comm && u.occ) {
      const c = (u.custAvg ?? d.need) / d.need;
      if (c < 1) { const p = Math.round((1 - c) * 45); parts.push(['Too few customers', -p]); v -= p; }
      else if (c > 1.3) { parts.push(['Busy', 5]); v += 5; }
    }
  }
  u._rate = { v: clamp(Math.round(v), 0, 100), parts };
  u._rateT = R.hourTick;
  return u._rate;
}
const hasRating = u => { const d = DEFS[u.type]; return !!(d.rent || d.sale || d.hotel || d.venue); };
function avgRating() {
  let s = 0, n = 0;
  for (const u of S.units) {
    const d = DEFS[u.type];
    if (!built(u)) continue;
    if ((isRental(u) && u.occ) || d.hotel) { s += rateUnit(u).v; n++; }
  }
  return n ? s / n : 0;
}
function towerTop() { let m = 0; for (const u of S.units) m = Math.max(m, u.f + u.h - 1); return m; }
const ratingWord = v => v >= 65 ? 'Good' : v >= 45 ? 'Fair' : 'Poor';

// ---- tenants arriving and leaving ----
function fillVacancies() {
  computeTower();
  let n = 0, tenants = 0;
  for (const u of S.units) if (isRental(u) && u.occ) tenants++;
  const appeal = tenants >= 4 ? clamp(avgRating() / 70, 0.45, 1.2) : 1;
  for (const u of S.units) {
    const d = DEFS[u.type];
    if (!isRental(u) || u.occ || !usable(u)) continue;
    if (d.minPop && R.pop < d.minPop) continue;
    const base = u.type === 'office' ? 0.5 : u.type === 'condo' ? 0.42 : u.type === 'penthouse' ? 0.25 : 0.5;
    const p = base * RENT_DEMAND[u.level] * (0.55 + 0.12 * Math.min(S.star, 5)) * appeal * (1 - (u._noise || 0) / 45);
    if (rnd() < p) { moveIn(u); n++; }
  }
  if (n) notice(`${plural(n, 'new tenant')} signed tonight.`, 'good');
}
function moveIn(u, quiet) {
  const d = DEFS[u.type];
  u.occ = true; u.travel = 75; u._rate = null;
  if (d.sale) { const p = Math.round(d.sale[u.level] * DIFFS[S.diff].rent); u.paid = p; if (!quiet) earn(p, 'sales', u); }
  if (d.comm) { u.custAvg = d.need; u.openDay = dayOf(S.time); }
  if (u.type === 'penthouse') S.flags.penthouse = true;
  R.dirty = true;
}
function vacate(u) {
  u.occ = false; u._rate = null;
  if (u.paid) { S.money -= u.paid; S.q.refund += u.paid; }
  u.paid = 0; u._present = 0;
  R.dirty = true;
}
function upkeepOf(u) {
  const d = DEFS[u.type];
  if (!d.upkeep) return 0;
  return d.upkeep * (isElev(u) ? u.cars : 1);
}
function quarterEnd(day) {
  let rent = 0, upkeep = 0;
  const mult = DIFFS[S.diff].rent;
  for (const u of S.units) {
    const d = DEFS[u.type];
    if (!built(u)) continue;
    if (d.rent && u.occ) rent += Math.round(d.rent[u.level] * mult);
    upkeep += upkeepOf(u);
  }
  earn(rent, 'rent');
  spend(upkeep, 'upkeep');
  if (S.loan > 0) spend(Math.round(S.loan * 0.04), 'interest');
  const outs = [], closed = [];
  for (const u of S.units) {
    const d = DEFS[u.type];
    if (!isRental(u) || !u.occ || !built(u)) continue;
    if (d.comm && (u.custAvg ?? d.need) < d.need * 0.5 && (u.openDay ?? 0) < day - 2) { vacate(u); closed.push(u); continue; }
    if (rateUnit(u).v < 38) { vacate(u); outs.push(u); }
  }
  const rating = avgRating();
  if (rating >= 70 && S.units.filter(u => isRental(u) && u.occ).length >= 10) S.flags.happyQ = true;
  const q = S.q;
  const income = q.rent + q.hotel + q.sales + q.tickets + q.bonus;
  const costs = q.build + q.upkeep + q.refund + q.interest + q.repair;
  const rec = Object.assign({ label: qLabel(day), day, income, costs, net: income - costs, pop: R.pop, rating: Math.round(rating) }, q);
  S.qHist.push(rec);
  if (S.qHist.length > 16) S.qHist.shift();
  S.q = emptyQuarter();
  let msg = `${rec.label} closed: ${fmtK(income)} in, ${fmtK(costs)} out.`;
  if (outs.length) msg += ` ${plural(outs.length, 'unhappy tenant')} left.`;
  if (closed.length) msg += ` ${plural(closed.length, 'shop')} closed for lack of customers.`;
  notice(msg, outs.length || closed.length ? 'warn' : 'good', outs[0] || closed[0]);
  emit('quarter', rec);
}

// ---- loans ----
const loanLimit = () => 1000000 * Math.min(S.star, 5);
function borrow(amt) {
  if (S.loan + amt > loanLimit()) return fail(`The bank lends up to ${fmt(loanLimit())} at ★${S.star}.`);
  S.loan += amt; S.money += amt;
  return OK;
}
function repay(amt) {
  amt = Math.min(amt, S.loan);
  if (amt <= 0) return fail('No loan to repay.');
  if (S.money < amt) return fail('Not enough cash to repay that.');
  S.loan -= amt; S.money -= amt;
  return OK;
}

// ---- stars ----
function reqStatus(n) {
  const r = REQ[n];
  if (!r) return null;
  computeTower();
  const items = [];
  items.push({ label: `Population ${R.pop.toLocaleString('en-US')} of ${r.pop.toLocaleString('en-US')}`, ok: R.pop >= r.pop, frac: Math.min(1, R.pop / r.pop) });
  for (const t of r.has || []) items.push({ label: `A working ${DEFS[t].name.toLowerCase()}${t === 'penthouse' ? ' with owners' : ''}`, ok: !!R.has[t] });
  if (r.rating) { const a = avgRating(); items.push({ label: `Average rating ${Math.round(a)} of ${r.rating}`, ok: a >= r.rating }); }
  if (r.critic) items.push({ label: 'A favorable review from the hotel critic', ok: !!S.critic.passed });
  if (r.height) { const t = towerTop(); items.push({ label: `Tower reaches ${fname(r.height)} (now ${fname(t)})`, ok: t >= r.height }); }
  return { items, ok: items.every(i => i.ok) };
}
function starCheck() {
  if (S.star >= 6) return;
  const st = reqStatus(S.star + 1);
  if (st && st.ok) {
    S.star++;
    notice(S.star === 6 ? 'Landmark status earned. The whole city looks up to your tower.' : `The tower is now rated ${S.star} stars.`, 'good');
    emit('star', { star: S.star });
    checkGoals();
  }
}

// ---- goals: a guided path with cash rewards ----
function countType(t, pred) { let n = 0; for (const u of S.units) if (u.type === t && built(u) && (!pred || pred(u))) n++; return n; }
function maxCust(cat) { let m = 0; for (const u of R.comm[cat] || []) m = Math.max(m, u._cust || 0); return m; }
const GOALS = [

function checkGoals() {

    const [a, b] = g.prog();
    if (a >= b) {
      S.goals[g.id] = dayOf(S.time);

    }

}
function activeGoals(n) {
  const out = [];

  return out;
}

// ---- events ----
function fireRoll() {
  if (!S.cfg.fires || S.star < 2 || rnd() > 0.045) return;
  const c = S.units.filter(u => u.f > 0 && !isTransit(u) && built(u));
  if (!c.length) return;
  startFire(pick(c));
}
function startFire(u) {
  u._fire = S.time; u._fireEnd = 0;
  notice(`Fire in the ${DEFS[u.type].name.toLowerCase()} on ${fname(u.f)}!`, 'bad', u);
  emit('fire', { u });
  for (const s of S.units.filter(x => x.type === 'security' && usable(x))) {
    for (let k = 0; k < 3; k++) trip({
      from: center(s), to: center(u), kind: 'guard', staff: true,
      onArrive: () => {
        if (alive(u) && u._fire && !u._fireEnd) { u._fireEnd = S.time + 900; at(u._fireEnd, () => extinguish(u)); }
        at(S.time + 1200, () => { if (alive(s) && alive(u)) trip({ from: center(u), to: center(s), kind: 'guard', staff: true }); });

}
function extinguish(u) {

  u._fire = 0; u._fireEnd = 0;

  emit('fireout', { u });
}
function burn(u) {
  const f = u.f, lo = u.col - 16, hi = u.col + u.w + 16;
  const v = S.units.filter(x => x.f <= f && x.f + x.h - 1 >= f && x.col + x.w > lo && x.col < hi && !isTransit(x));
  for (const x of v) removeUnit(x, 'fire');
  notice(`The fire on ${fname(f)} destroyed ${plural(v.length, 'room')}. A security office would have stopped it.`, 'bad');
  emit('fireout', { u });
}
function breakdownRoll() {
  for (const [id, rt] of R.shaft) {
    const u = R.byId.get(id);
    if (!u || !built(u)) continue;
    const use = (u.yBoards || 0) / Math.max(1, u.cars);
    if (rnd() < 0.012 + Math.min(0.05, use / 30000)) {
      const car = rt.cars.find(c => !c.broken && c.pax.length === 0 && c.prog === 0);
      if (!car) continue;
      car.broken = S.time + 5 * HR; car.dir = 0; car.dwell = 0;
      notice(`An elevator car broke down (${fname(u.f)}–${fname(u.top)}). It will be out for five hours unless you call a technician.`, 'warn', u);
      emit('breakdown', { u });
    }
  }
}
function conventionRoll(day) {
  const rooms = S.units.filter(u => DEFS[u.type].hotel && built(u)).length;
  if (rooms >= 10 && rnd() < 0.3) {
    S.conv = Math.floor(day / 3);
    notice('A convention is in town this week. Expect a rush on hotel rooms toward the weekend.', 'good');
  }
}
function criticRoll() {
  const cr = S.critic, day = dayOf(S.time);
  if (S.star < 3 || cr.passed || cr.state === 'visiting' || day - cr.day < 5) return;
  const suites = S.units.filter(u => u.type === 'suite' && usable(u) && !u.dirty && !u.infest && !u._booked);

}
function criticVerdict(u) {
  const cr = S.critic, rating = rateUnit(u).v, waitMin = (cr.wait || 0) / 60;
  const notes = [];
  if (rating < 68) notes.push('the room rated only ' + rating);

// ============================================================================
// Building, demolishing, and starting a new game
// ============================================================================
const starOK = d => S.sandbox || d.star <= S.star;
const maxFloorNow = () => S.sandbox ? MAXF : MAXFLOOR[S.star];
const minFloorNow = () => S.sandbox ? MINF : MINFLOOR[S.star];
function hOf(type, f, top) { const d = DEFS[type]; return d.transit === 'elev' ? (top - f + 1) : (d.h || 1); }

// can `type` go at floor f, column col (elevators span f..top)? returns {ok,msg,cost,w,h}
function check(type, f, col, top) {
  const d = DEFS[type], w = d.w, h = hOf(type, f, top);
  const res = { ok: false, msg: '', cost: 0, w, h, f, col };
  const no = m => { res.msg = m; return res; };
  if (!starOK(d)) return no(`Unlocks at ★${d.star}.`);
  if (col < 0 || col + w > COLS) return no('That runs off the lot.');
  const hi = f + h - 1;
  if (hi > maxFloorNow()) return no(`At ★${S.star} you can build up to ${fname(maxFloorNow())}.`);
  if (f < minFloorNow()) return no(`At ★${S.star} you can dig down to ${fname(minFloorNow())}.`);
  // lobby floors (1F, 15F, 30F … 90F, 99F) take lobby and nothing else; lobby goes nowhere else
  if (type === 'lobby') {
    if (!lobbyFloor(f)) return no('Lobby only goes on 1F, 15F, 30F, 45F, 60F, 75F, 90F and 99F.');
  } else if (!d.transit) {
    for (let ff = f; ff <= hi; ff++) if (lobbyFloor(ff)) return no(`${fname(ff)} is a lobby floor. Only lobby can be built there.`);
  }
  if (d.basement && hi > -1) return no('Basement only.');
  if (d.minF !== undefined && f < d.minF) return no(`Must sit on ${fname(d.minF)} or higher.`);
  if (d.transit === 'elev') {
    if (h < 2) return no('Drag up or down to span at least two floors.');
    if (h > d.range) return no(`Spans at most ${d.range} floors.`);
    if (d.express) { let n = 0; for (let ff = f; ff <= hi; ff++) if (expressFloor(ff)) n++; if (n < 2) return no('An express must reach two lobby floors (1F, 15F, 30F…) or basements.'); }
  }
  let newTiles = 0;
  for (let ff = f; ff <= hi; ff++) {
    for (let c = col; c < col + w; c++) {
      const t = tileAt(ff, c);
      if (d.transit) {
        if (egridAt(ff, c)) return no('Another elevator or stairway is already here.');
        if (!t) return no(d.transit === 'elev' ? `${fname(ff)} has no floor here yet.` : 'Stairs and escalators need floor to stand on.');

        if (d.tile) { if (t === d.tile) return no('Already built.'); if (t === 2) return no('That is lobby.'); }

    if (f + 1 > maxFloorNow()) return no('Nothing above to connect to.');
    if (!tileAt(f + 1, col + w - 1)) return no(`Needs floor on ${fname(f + 1)} to land on.`);

  if (!d.transit) {
    if (f > 0) { for (let c = col; c < col + w; c++) if (!tileAt(f - 1, c)) return no('Needs floor directly underneath.'); }

  }
  let cost = d.cost + (d.perFloor ? d.perFloor * h : 0);
  if (!d.tile && !d.transit) cost += newTiles * DEFS.floor.cost;
  if (!canAfford(cost)) return no(`Costs ${fmt(cost)}. You have ${fmt(S.money)}.`);

}

function place(type, f, col, top, opts) {
  const r = check(type, f, col, top);
  if (!r.ok) return r;
  const d = DEFS[type], instant = opts && opts.instant;
  spend(r.cost, 'build');
  if (d.tile) { R.tile[FI(f)][col] = d.tile; R.dirty = true; r.tile = true; return r; }
  const u = {
    id: S.nextId++, type, f, col, w: d.w, h: r.h, level: 1, travel: 75,
    occ: !isRentalDef(d), seed: (rnd() * 1e6) | 0,
    ready: instant ? 0 : S.time + (d.build || 0) * HR

  if (d.transit === 'elev') { u.top = f + r.h - 1; u.cars = 1; u.stops = defaultStops(u); }
  if (d.hotel) u.dirty = false;
  S.units.push(u);
  register(u);
  S.stats.built++;
  if (!instant && u.ready > S.time) at(u.ready, () => finishBuild(u));

}
function finishBuild(u) {
  if (!alive(u)) return;
  R.dirty = true; u._rate = null;

  if (DEFS[u.type].venue) schedVenue(u, dayOf(S.time) * DAY, isWeekend(dayOf(S.time)));
  emit('built', { u });
}

function bulldozeAt(f, c) {
  const u = unitAt(f, c);
  if (u) { removeUnit(u, 'doze'); return { ok: true, msg: '', u }; }
  const t = tileAt(f, c);
  if (!t) return fail('');
  const blocked = (f >= 0 && tileAt(f + 1, c)) || (f === 0 && tileAt(-1, c)) || (f < 0 && tileAt(f - 1, c));
  if (blocked) return fail(f >= 0 ? 'Clear the floor above first.' : 'Clear the basement below first.');
  R.tile[FI(f)][c] = 0; R.dirty = true;
  return { ok: true, msg: '', tile: true };
}

// ---- new games ----
function newGame(opts) {
  opts = opts || {};
  S = newState(opts);
  RSEED = S.seed;
  initRuntime();
  if (opts.starter !== false) buildStarter();
  rebuildGraph();
  dayStart(0);
  notice(opts.starter !== false ? 'Your tower is open. Offices fill up from 7:30, hotel guests check in from 15:30.' : 'An empty lot. Start with a lobby along the ground floor.', 'good');
  emit('newgame', {});
}
function buildStarter() {
  const keep = S.sandbox, I = { instant: true };
  S.sandbox = true;                       // free construction while we lay the starter out
  const row = (type, f, a, b) => { for (let c = a; c <= b; c++) place(type, f, c, 0, I); };
  row('lobby', 0, 96, 143);
  row('floor', -1, 96, 143);
  for (let f = 1; f <= 6; f++) row('floor', f, 96, 143);
  place('elevator', -1, 116, 6, I);
  place('stairs', 0, 110, 0, I);
  place('fastfood', 1, 96, 0, I);
  place('cafe', 1, 108, 0, I);
  for (const c of [122, 131]) place('office', 1, c, 0, I);
  for (const f of [2, 3]) for (const c of [96, 105, 122, 131]) place('office', f, c, 0, I);
  for (const c of [96, 122]) place('condo', 4, c, 0, I);
  for (const c of [96, 100, 104, 108, 122, 126, 130, 134]) place('single', 5, c, 0, I);
  place('housekeeping', 6, 96, 0, I);
  for (const c of [122, 126, 130, 134]) place('parking', -1, c, 0, I);
  S.sandbox = keep;
  for (const u of S.units) {
    if (u.type === 'office' || u.type === 'fastfood' || u.type === 'cafe') moveIn(u, true);
  }
  const condo = S.units.find(u => u.type === 'condo');
  if (condo) moveIn(condo, true);
  S.money = Math.round(DIFFS[S.diff].money * 0.6);
  S.q = emptyQuarter();
  S.stats.built = 0;
}

function paintVacant(P, label) {
  const w = P.w, FL = shell(P, '#a9b1ba');
  P.win(Math.min(6, w * 0.18), 6, Math.max(6, Math.min(w * 0.64, w - 12)), 9, '#727c89', Math.max(1, Math.round(w / 24)));
  for (let x = 8; x < w - 4; x += 16) P.r(x, 1.5, 0.5, 2.6, '#727c89');
  const bw = Math.min(w - 6, 26), bx = (w - bw) / 2;
  P.r(bx, FL - 11, bw, 6.4, '#f7f3e6'); P.r(bx, FL - 11, bw, 1, '#c7553f');
  P.t(label, w / 2, FL - 7.2, Math.min(3.4, bw / 5.2), '#39424f');
  P.r(bx + 2, FL - 4.6, 0.6, 4.6, '#727c89'); P.r(bx + bw - 2.6, FL - 4.6, 0.6, 4.6, '#727c89');
}

// ---- ambience: street hum, wind up high, rain, a murmur where people gather ----

// ---- music: a slow original loop of soft chords and a wandering melody ----
const CHORDS = [[261.63, 329.63, 392.0, 493.88], [220.0, 261.63, 329.63, 392.0], [174.61, 220.0, 261.63, 329.63], [196.0, 246.94, 293.66, 392.0]];

  const barLen = 3.6;

    const t0 = audio.nextBar, ch = CHORDS[audio.bar % CHORDS.length], calm = night > 0.6 ? 0.7 : 1;

}

// ---- reports ----
function lineChart(id, vals, color, label) {
  const c = document.getElementById(id); if (!c) return;
  const w = c.clientWidth || 300, h = c.clientHeight || 90;
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d'); g.scale(2, 2);
  g.clearRect(0, 0, w, h);
  if (vals.length < 2) { g.fillStyle = '#93a3b6'; g.font = '12px "IBM Plex Sans", sans-serif'; g.fillText('Charts fill in after a couple of days.', 6, h / 2); return; }
  const max = Math.max(...vals, 1), min = Math.min(...vals, 0), rg = max - min || 1, px = i => 4 + i * (w - 8) / (vals.length - 1), py = v => h - 16 - (v - min) / rg * (h - 30);
  g.strokeStyle = 'rgba(147,163,182,.25)'; g.lineWidth = 1;
  for (let i = 0; i < 3; i++) { const y = 8 + i * (h - 26) / 2; g.beginPath(); g.moveTo(4, y); g.lineTo(w - 4, y); g.stroke(); }
  g.beginPath(); g.moveTo(px(0), py(vals[0])); for (let i = 1; i < vals.length; i++) g.lineTo(px(i), py(vals[i]));
  g.strokeStyle = color; g.lineWidth = 2; g.stroke();
  g.lineTo(px(vals.length - 1), h - 16); g.lineTo(px(0), h - 16); g.closePath(); g.globalAlpha = 0.14; g.fillStyle = color; g.fill(); g.globalAlpha = 1;
  g.fillStyle = color; g.beginPath(); g.arc(px(vals.length - 1), py(vals[vals.length - 1]), 3, 0, 6.2832); g.fill();
  g.fillStyle = '#93a3b6'; g.font = '10px "IBM Plex Mono", monospace'; g.textBaseline = 'alphabetic';
  g.textAlign = 'left'; g.fillText(label(min), 4, h - 3); g.textAlign = 'right'; g.fillText(label(vals[vals.length - 1]) + ' now · peak ' + label(max), w - 4, h - 3);
}
const REPORT_TABS = [['overview', 'Overview'], ['goals', 'Goals'], ['money', 'Money'], ['tenants', 'Tenants'], ['elevators', 'Elevators'], ['news', 'News']];

  else if (m === 'import') showImport();
  else if (m === 'fires') { S.cfg.fires = !S.cfg.fires; b.textContent = 'Fires: ' + (S.cfg.fires ? 'on' : 'off'); }
  else if (m === 'sfx') { setSfx(!audio.sfxOn); b.textContent = 'Sound effects: ' + (audio.sfxOn ? 'on' : 'off'); syncSoundBtn(); }
  else if (m === 'music') { setMusic(!audio.musicOn); b.textContent = 'Music: ' + (audio.musicOn ? 'on' : 'off'); syncSoundBtn(); }
  else if (m === 'new') showNewGame();
  else if (m === 'help') showHelp();
});
document.querySelector('.speeds').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { audioInit(); setSpeed(+b.dataset.s); sfx('click'); } });
$('bOverlay').addEventListener('click', cycleOverlay);
$('bSound').addEventListener('click', () => { audioInit(); toggleSound(); });
$('bReports').addEventListener('click', () => { audioInit(); showReports('overview'); });
$('sStars').addEventListener('click', () => showReports('overview'));
$('cYes').addEventListener('click', confirmYes);
$('cNo').addEventListener('click', () => clearGhost());
$('zoomBtns').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const z = b.dataset.z;
  if (z === 'in') zoomAt(VW / 2, VH / 2, 1.3); else if (z === 'out') zoomAt(VW / 2, VH / 2, 1 / 1.3); else centerCam();
});
// minimap: click or drag to jump
(() => {
  const m = $('mini'); let down = false;
  const go = e => { const r = m.getBoundingClientRect(); miniJump(e.clientX - r.left, e.clientY - r.top); };
  m.addEventListener('pointerdown', e => { down = true; m.setPointerCapture(e.pointerId); go(e); });
  m.addEventListener('pointermove', e => { if (down) go(e); });
  m.addEventListener('pointerup', () => { down = false; });
  m.addEventListener('pointercancel', () => { down = false; });
})();
// phone layout helpers
let railOpen = true;
try { railOpen = localStorage.getItem('to2-rail') !== '0'; } catch (e) { /* ignore */ }
function applyRail() { $('app').classList.toggle('norail', !railOpen); setTimeout(resize, 0); }
$('bRail').addEventListener('click', () => { railOpen = !railOpen; try { localStorage.setItem('to2-rail', railOpen ? '1' : '0'); } catch (e) { /* ignore */ } applyRail(); });
const portraitQ = matchMedia('(pointer:coarse) and (orientation:portrait) and (max-width:540px)');
let rotateDismissed = false;
function checkRotate() { $('rotate').hidden = rotateDismissed || !portraitQ.matches; }
$('rotateOk').addEventListener('click', () => { rotateDismissed = true; checkRotate(); });
if (portraitQ.addEventListener) portraitQ.addEventListener('change', () => { checkRotate(); setTimeout(resize, 50); });
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(true); });
addEventListener('pagehide', () => { if (S) save(true); });

// ---- the sim talks, the interface reacts ----
on((type, d) => {
  switch (type) {
    case 'notice':
      showTicker();
      if (d.kind === 'bad') sfx('warn');
      break;
    case 'money':
      if (d.u && d.amt > 0 && alive(d.u) && cam.z > 0.5) {
        const u = d.u, wx = (u.col + u.w / 2) * W, wy = -(u.f + u.h) * H + 8;
        if (onScreen(wx, wy, 20)) { floater(wx, wy, '+' + fmtK(d.amt), '#9be7a6'); if (d.kind !== 'tickets' || Math.random() < 0.2) sfx('cash', 0.7); }
      }
      break;
    case 'placed': break;
    case 'built': {
      const u = d.u, wx = (u.col + u.w / 2) * W, wy = -(u.f + u.h / 2) * H;
      if (onScreen(wx, wy, 60)) { burst(wx, wy, 16, '#f4d27a', u.w * W * 0.8, 30); sfx('done', 0.8); }
      if (sel === u) renderPanel();
      break;
    }
    case 'removed': {
      const u = d.u, wx = (u.col + u.w / 2) * W, wy = -(u.f + u.h / 2) * H;
      if (onScreen(wx, wy, 60)) burst(wx, wy, 22, 'rgba(150,150,156,.8)', u.w * W, 16);
      if (sel === u) closePanel();
      if (dozeT && dozeT.u === u) { dozeT = null; updateConfirm(); }
      break;
    }
    case 'ding': {
      const u = d.u, wx = (u.col + u.w / 2) * W, wy = -(d.f + 0.5) * H;
      if (cam.z > 0.6 && onScreen(wx, wy, 0)) sfx('ding', clamp(cam.z / 2.5, 0.25, 0.9));
      break;
    }
    case 'star': buildToolbar(); sfx('star'); showStarModal(); break;
    case 'goal': sfx('goal'); renderGoalCard(); flash(`Goal met: ${d.g.title}. ${fmt(d.g.reward)} bonus.`); break;
    case 'quarter': sfx('register'); break;
    case 'fire': sfx('alarm'); break;
    case 'breakdown': case 'critic': sfx('warn'); break;
    case 'autosave': save(true); break;
  }
});

// ============================================================================
// Main loop and start-up
// ============================================================================
let simAcc = 0, lastFrame = 0, tUi = 0, tPanel = 0, tSlow = 0, frameErrs = 0;

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now; nowMs = now;
  try {
    const rate = SPEEDS[speed];
    if (rate > 0 && modal.hidden) {
      simAcc += dt * rate / STEP;
      let n = Math.floor(simAcc); simAcc -= n;
      // never let a slow device spiral: spend at most ~14 ms a frame simulating
      const t0 = performance.now();
      while (n-- > 0) { simStep(); if (performance.now() - t0 > 14) { simAcc = 0; break; } }
      simAlpha = simAcc;
      worldClock += dt * Math.min(rate / 60, 4);
    } else simAlpha = 1;
    draw(dt);
    tUi += dt; tPanel += dt; tSlow += dt;
    if (tUi > 0.2) { tUi = 0; updateTop(); if (ghost || dozeT) updateConfirm(); drawMini(); ambienceUpdate(); musicTick(); }
    if (tPanel > 0.7) { tPanel = 0; if (!panelEl.hidden && sel && !panelEl.matches(':hover')) renderPanel(); }
    if (tSlow > 1) { tSlow = 0; renderGoalCard(); }
  } catch (err) {
    if (frameErrs++ < 5) console.error(err);
  }
}

// extra menu entry that the phone layout relies on (the Reports button is hidden there)
menuEl.addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.m === 'reports') showReports('overview'); });

function start(data) {
  resize();
  let loaded = false;
  if (data && data.save) { try { deserialize(data.save); afterLoad(); loaded = true; } catch (e) { loaded = false; } }
  if (!loaded) loaded = loadSaved();
  const fresh = !loaded;
  if (fresh) { newGame({ starter: true, diff: 'normal', sandbox: false }); afterLoad(); }
  setSpeed(data && typeof data.speed === 'number' ? data.speed : 2);
  setOverlay('none'); syncSoundBtn(); setTool('inspect'); applyRail(); checkRotate();
  if (data && data.cam) { cam.x = data.cam.x; cam.y = data.cam.y; cam.z = data.cam.z; clampCam(); } else centerCam();
  updateTop(); showTicker(); renderGoalCard();
  let seen = false;
  try { seen = localStorage.getItem('to2-seen') === '1'; localStorage.setItem('to2-seen', '1'); } catch (e) { /* storage may be blocked */ }
  if (fresh && !seen) showHelp();
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('gesturestart', e => e.preventDefault());

// keep the tower when the page is updated while open
if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') {
  try { window.claude.hot.snapshot(() => ({ save: serialize(), cam: { x: cam.x, y: cam.y, z: cam.z }, speed })); } catch (e) { /* not in a viewer */ }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
