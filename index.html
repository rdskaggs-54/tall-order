<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0f1620;}

<title>Tall Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table chrome. Fixed top ledger, plan-drawer toolbar on the left, the tower elevation fills the rest. Single committed dark look. */
:root{
  color-scheme: dark;
  --ink:#0f1620;        /* page ground, blueprint night */
  --sheet:#17212d;      /* panels */
  --sheet2:#1f2b3a;     /* raised controls */
  --rule:#2c3b4e;       /* hairlines */
  --chalk:#e7edf3;      /* primary text */
  --pencil:#93a3b6;     /* secondary text */
  --brass:#e9b44c;      /* the one accent: brass elevator plates */
  --good:#58a6ff; --warn:#f0cf4a; --bad:#f06a5e; --cash:#86d993;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
html{box-sizing:border-box;}
html,body{height:100%;overscroll-behavior:none;}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;}
textarea{-webkit-user-select:text;user-select:text;}
button{touch-action:manipulation;}
[hidden]{display:none!important;}
body{background:var(--ink);color:var(--chalk);font-family:var(--body);overflow:hidden;}
#app{height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-sizing:border-box;display:grid;grid-template-columns:214px 1fr;grid-template-rows:auto 1fr 30px;grid-template-areas:"top top" "tools stage" "tick tick";}
#top{grid-area:top;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:8px 16px;background:var(--sheet);border-bottom:1px solid var(--rule);}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em;line-height:1;color:var(--chalk);display:flex;align-items:flex-end;gap:2px;}
.brand i{display:inline-block;width:6px;background:var(--brass);height:22px;margin-left:6px;font-style:normal;}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0;}
.stat .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pencil);white-space:nowrap;}
.stat .v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.money{color:var(--cash);} .neg{color:var(--bad);}
.spacer{flex:1;}
button{font:inherit;color:var(--chalk);background:var(--sheet2);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;cursor:pointer;}
button:hover{border-color:var(--pencil);}
button:focus-visible{outline:2px solid var(--brass);outline-offset:1px;}
button.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;}
button:disabled{opacity:.45;cursor:not-allowed;}
.stars{font-family:var(--display);font-size:20px;letter-spacing:.08em;color:var(--brass);background:transparent;border-color:transparent;padding:2px 6px;}
.speeds{display:flex;gap:2px;}
.speeds button{font-family:var(--mono);font-size:12px;padding:5px 8px;min-width:34px;}
#tools{grid-area:tools;background:var(--sheet);border-right:1px solid var(--rule);overflow-y:auto;padding:10px 10px 24px;display:flex;flex-direction:column;gap:12px;}
.cat h3{margin:0 0 5px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);}
.cat .list{display:flex;flex-direction:column;gap:3px;}
.tb{display:grid;grid-template-columns:1fr auto;gap:2px 6px;text-align:left;padding:5px 8px;background:transparent;border-color:transparent;}
.tb:hover{background:var(--sheet2);}
.tb .n{font-size:13px;font-weight:500;}
.tb .c{font-family:var(--mono);font-size:11px;color:var(--pencil);align-self:center;}
.tb.on{background:var(--sheet2);border-color:var(--brass);color:var(--chalk);font-weight:500;}
.tb.on .c{color:var(--brass);}
.tb.locked .n{color:var(--pencil);}
#stage{grid-area:stage;position:relative;overflow:hidden;min-width:0;}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#tip{position:absolute;pointer-events:none;background:rgba(15,22,32,.94);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;font-size:12px;max-width:240px;line-height:1.35;}
#tip b{font-weight:600;} #tip .m{font-family:var(--mono);color:var(--brass);} #tip .x{color:var(--bad);}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--sheet2);border:1px solid var(--brass);color:var(--chalk);border-radius:4px;padding:7px 12px;font-size:13px;pointer-events:none;max-width:calc(100% - 32px);}
#panel{position:absolute;right:12px;top:12px;width:290px;max-height:calc(100% - 24px);overflow-y:auto;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.35);}
#panel h2{margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:.03em;line-height:1.05;text-wrap:balance;}
#panel .sub{color:var(--pencil);font-size:12px;margin-top:2px;}
#panel .row{display:flex;justify-content:space-between;gap:10px;font-size:13px;}
#panel .row span:last-child{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;}
#panel p{margin:0;font-size:12.5px;line-height:1.45;color:var(--pencil);}
.x-close{position:absolute;right:8px;top:8px;padding:2px 8px;background:transparent;border-color:transparent;color:var(--pencil);font-size:18px;}
.bar{height:8px;background:var(--sheet2);border-radius:4px;overflow:hidden;}
.bar i{display:block;height:100%;}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;}
.seg button{font-size:11px;padding:5px 2px;}
.stops{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;}
.stops button{font-family:var(--mono);font-size:10.5px;padding:4px 0;}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;}
.danger{border-color:#6d3631;color:#ffb3ab;}
.lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--pencil);}
.req{display:flex;gap:8px;font-size:13px;align-items:baseline;}
.req .ok{color:var(--cash);} .req .no{color:var(--pencil);}
.log{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--pencil);}
#ticker{grid-area:tick;background:var(--sheet);border-top:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:12.5px;overflow:hidden;white-space:nowrap;cursor:pointer;}
#ticker .t{font-family:var(--mono);color:var(--pencil);font-size:11px;}
#ticker.good #tickMsg{color:var(--cash);} #ticker.bad #tickMsg{color:var(--bad);} #ticker.warn #tickMsg{color:var(--warn);}
#tickMsg{overflow:hidden;text-overflow:ellipsis;}
#menu{position:absolute;right:12px;top:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:200px;z-index:5;}
#menu button{text-align:left;}
#modal{position:fixed;inset:0;background:rgba(5,9,14,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10;}
#modal .card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;max-width:560px;width:100%;max-height:calc(100% - 32px);overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:12px;}
#modal h1{margin:0;font-family:var(--display);font-weight:800;font-size:40px;letter-spacing:.04em;line-height:1;}
#modal h4{margin:6px 0 0;font-family:var(--display);font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);}
#modal p,#modal li{font-size:14px;line-height:1.5;color:var(--chalk);max-width:65ch;}
#modal ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;}
#modal kbd{font-family:var(--mono);font-size:12px;background:var(--sheet2);border:1px solid var(--rule);border-radius:3px;padding:0 4px;}
#modal textarea{width:100%;min-height:120px;background:var(--ink);color:var(--chalk);border:1px solid var(--rule);border-radius:4px;font-family:var(--mono);font-size:11px;padding:8px;box-sizing:border-box;}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto 26px;grid-template-areas:"top" "stage" "tools" "tick";}
  #top{gap:10px;padding:6px 12px;}
  .brand{font-size:20px;} .stat .v{font-size:13px;}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-top:1px solid var(--rule);padding:6px 10px;gap:14px;max-height:118px;}
  .cat{flex:none;} .cat .list{flex-direction:row;}
  .tb{grid-template-columns:auto;min-width:86px;}
  #panel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:55%;}
  #menu{right:8px;}
}

/* touch-only controls */
.touchonly{display:none;}
.railbtn{display:none;font-size:18px;line-height:1;padding:6px 10px;}
#zoomBtns{position:absolute;right:12px;bottom:12px;flex-direction:column;gap:6px;}
#zoomBtns button{width:44px;height:44px;font-size:22px;padding:0;background:rgba(31,43,58,.92);}
#confirm{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--brass);border-radius:8px;padding:6px 6px 6px 12px;max-width:calc(100% - 120px);box-shadow:0 6px 24px rgba(0,0,0,.4);}
#confirm .cTxt{display:flex;flex-direction:column;min-width:0;}
#confirm b{font-size:13px;white-space:nowrap;}
#confirm span{font-family:var(--mono);font-size:12px;color:var(--cash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#confirm span.x{color:var(--bad);font-family:var(--body);white-space:normal;}
#confirm button{min-width:44px;height:44px;font-size:16px;}
#cYes{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:600;padding:0 16px;}
#cYes:disabled{background:var(--sheet2);color:var(--pencil);border-color:var(--rule);}
#cYes.danger{background:#a8423a;border-color:#a8423a;color:#fff;}
#rotate{position:fixed;inset:0;z-index:20;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
#rotate div{display:flex;flex-direction:column;gap:10px;align-items:center;max-width:280px;}
#rotate b{font-family:var(--display);font-size:30px;letter-spacing:.04em;line-height:1.05;}
#rotate span{color:var(--pencil);font-size:14px;}
@media (pointer:coarse){
  .touchonly{display:flex;}
  .tb{padding:9px 8px;}
}
/* phones held sideways */
@media (pointer:coarse) and (orientation:landscape) and (max-height:540px){
  #app{grid-template-columns:150px 1fr;grid-template-rows:auto 1fr 22px;}
  #app.norail{grid-template-columns:0 1fr;}
  #app.norail #tools{visibility:hidden;padding:0;border:0;}
  .railbtn{display:block;}
  .brand{display:none;}
  #top{gap:10px;padding:4px 8px;flex-wrap:nowrap;}
  .stat .k{font-size:9px;letter-spacing:.08em;}
  .stat .v{font-size:13px;}
  .stars{font-size:15px;padding:2px 2px;}
  #top button{padding:5px 8px;}
  .speeds button{min-width:30px;padding:5px 4px;}
  #tools{padding:6px 6px 16px;gap:8px;}
  .cat h3{font-size:11px;margin-bottom:2px;}
  .tb{grid-template-columns:1fr;gap:0;padding:7px 8px;}
  .tb .n{font-size:12.5px;}
  .tb .c{font-size:10px;}
  #panel{top:6px;bottom:6px;right:6px;width:260px;max-height:none;padding:12px;gap:8px;}
  #panel h2{font-size:20px;}
  #ticker{font-size:11.5px;padding:0 10px;}
  #confirm{bottom:8px;max-width:calc(100% - 80px);}
  #toast{font-size:12px;padding:5px 10px;max-width:60%;}
  #zoomBtns{right:8px;bottom:8px;}
  #zoomBtns button{width:40px;height:40px;}
  #modal .card{padding:16px 18px;gap:8px;}
  #modal h1{font-size:30px;}
}
@media (pointer:coarse) and (orientation:landscape) and (max-height:540px) and (max-width:700px){
  .stat.pop{display:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

</head>
<body>
<div id="app">
  <header id="top">
    <button id="bRail" class="railbtn" aria-label="Show or hide build menu">☰</button>
    <div class="brand">TALL ORDER<i></i></div>
    <div class="stat"><span class="k">Funds</span><span id="sMoney" class="v money">$0</span></div>
    <div class="stat"><span class="k" id="sDate">Year 1</span><span id="sClock" class="v">07:00</span></div>
    <div class="stat pop"><span class="k">Population</span><span id="sPop" class="v">0</span></div>
    <button id="sStars" class="stars" title="Tower status and next rating">★☆☆☆☆</button>
    <div class="spacer"></div>
    <div class="speeds" role="group" aria-label="Game speed">
      <button data-s="0" title="Pause (P)">II</button>
      <button data-s="1" title="Normal (1)">1×</button>
      <button data-s="2" title="Fast (2)">2×</button>
      <button data-s="4" title="Faster (3)">4×</button>
      <button data-s="8" title="Fastest (4)">8×</button>
    </div>
    <button id="bOverlay" title="Color units by tenant rating (R)">Ratings</button>
    <button id="bMenu">Menu</button>
  </header>
  <aside id="tools" aria-label="Build tools"></aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="tip" hidden></div>
    <div id="toast" hidden></div>
    <div id="zoomBtns" class="touchonly" aria-label="Zoom"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button><button data-z="home" aria-label="Center on tower">⌂</button></div>
    <div id="confirm" hidden><div class="cTxt"><b id="cName"></b><span id="cMsg"></span></div><button id="cNo" aria-label="Cancel">✕</button><button id="cYes">Build</button></div>
    <div id="rotate" hidden><div><b>Turn your phone sideways</b><span>Tall Order plays best in landscape.</span><button id="rotateOk">Play anyway</button></div></div>
    <section id="panel" hidden></section>
    <div id="menu" hidden>
      <button data-m="status">Tower status</button>
      <button data-m="save">Save now</button>
      <button data-m="load">Load last save</button>
      <button data-m="export">Copy save code</button>
      <button data-m="import">Load from code or file</button>
      <button data-m="fires">Fires: on</button>
      <button data-m="starter">New game with starter tower</button>
      <button data-m="empty">New game on empty lot</button>
      <button data-m="help">How to play</button>
    </div>
  </main>
  <footer id="ticker"><span class="t" id="tickT"></span><span id="tickMsg">Welcome.</span></footer>
</div>
<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<input type="file" id="fileIn" accept=".json,.txt,application/json,text/plain" hidden>

<script>
'use strict';
// ================= constants =================
const W=8,H=28,COLS=220,MINF=-10,MAXF=100,NF=MAXF-MINF+1,STEP=5,DAY=86400,HR=3600,BASE_RATE=300,MAXP=6000;
const FI=f=>f-MINF;
// sky lobbies land on 15F, 30F, 45F, 60F, 75F, 90F and a luxury top lobby on 99F (internal index = shown floor − 1)
const SKY_LOBBIES=[14,29,44,59,74,89,98];
const isSkyLobby=f=>SKY_LOBBIES.includes(f);
const expressFloor=f=>f<=0||isSkyLobby(f);
const rnd=Math.random, rr=(a,b)=>a+rnd()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v;
const fmt=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmtK=n=>{const a=Math.abs(n);const s=a>=1e6?(a/1e6).toFixed(a%1e6?2:0)+'M':a>=1e3?Math.round(a/1e3)+'K':String(a);return (n<0?'−$':'$')+s;};
const fname=f=>f>=0?(f+1)+'F':'B'+(-f);

const DEFS={
 floor:{name:'Floor',cat:'Structure',w:1,cost:500,star:1,tile:1,desc:'Empty floor slab. Drag sideways. Anything you build needs floor directly under it.'},
 lobby:{name:'Lobby',cat:'Structure',w:1,cost:1000,star:1,tile:2,desc:'Everyone enters here. Ground floor, plus sky lobbies on 15F, 30F, 45F, 60F, 75F, 90F and 99F from ★3. Drag sideways.'},
 stairs:{name:'Stairs',cat:'Transit',w:2,cost:5000,star:1,transit:'stairs',desc:'Links a floor to the one above. People tolerate a flight or two.'},
 escalator:{name:'Escalator',cat:'Transit',w:4,cost:20000,star:2,transit:'esc',upkeep:3000,desc:'Quick, comfortable link to the floor above. Good between retail floors.'},
 elevator:{name:'Elevator',cat:'Transit',w:4,cost:100000,perFloor:4000,carCost:60000,star:1,transit:'elev',range:30,speed:1,cap:16,upkeep:8000,desc:'Sits on top of the tower and runs straight through rooms. Drag up or down to set its span (max 30 floors); grab it later to stretch or shrink it.'},
 freight:{name:'Service Elevator',cat:'Transit',w:4,cost:80000,perFloor:3000,carCost:50000,star:2,transit:'elev',staffOnly:true,range:30,speed:1,cap:10,upkeep:6000,desc:'Staff only. Housekeepers and guards ride it so guests don’t wait behind them.'},
 express:{name:'Express Elevator',cat:'Transit',w:6,cost:300000,perFloor:8000,carCost:150000,star:3,transit:'elev',express:true,range:111,speed:3,cap:30,upkeep:20000,desc:'Stops only at lobby floors (1F, 15F, 30F … 90F, 99F) and basements. Three times as fast.'},
 office:{name:'Office',cat:'Rentals',w:9,cost:40000,star:1,pop:6,rent:[16000,10000,7000,4000],desc:'Six weekday commuters who want lunch nearby. Pays rent each quarter.'},
 condo:{name:'Condo',cat:'Rentals',w:16,cost:80000,star:1,pop:3,sale:[180000,130000,90000,50000],desc:'Sold once to a family of three. If they move out unhappy, you refund the sale.'},
 single:{name:'Single Room',cat:'Hotel',w:4,cost:20000,star:1,hotel:true,guests:1,nightly:[3000,2000,1400,800],desc:'One guest a night. Must be cleaned before it can be booked again.'},
 twin:{name:'Twin Room',cat:'Hotel',w:6,cost:50000,star:2,hotel:true,guests:2,nightly:[5000,3500,2400,1200],desc:'Two guests a night.'},
 suite:{name:'Suite',cat:'Hotel',w:10,cost:100000,star:3,hotel:true,guests:3,nightly:[12000,8000,5000,2500],desc:'Three guests at the top nightly rate. Needed for ★4.'},
 fastfood:{name:'Fast Food',cat:'Retail',w:12,cost:100000,star:1,comm:'food',pop:8,rent:[14000,10000,7000,4000],need:25,minPop:0,desc:'Feeds the office lunch rush. Needs about 25 customers a day to stay open.'},
 shop:{name:'Shop',cat:'Retail',w:10,cost:100000,star:2,comm:'shop',pop:5,rent:[12000,9000,6000,3500],need:12,minPop:150,desc:'Afternoon shoppers. Needs about 12 customers a day.'},
 restaurant:{name:'Restaurant',cat:'Retail',w:20,cost:200000,star:2,comm:'dine',pop:10,rent:[24000,18000,12000,7000],need:15,minPop:250,desc:'Dinner crowd and hotel guests. Needs about 15 customers a day.'},
 cinema:{name:'Cinema',cat:'Leisure',w:28,h:2,cost:500000,star:3,venue:'cinema',ticket:80,capacity:120,upkeep:30000,desc:'Evening shows, plus matinees on weekends. Earns per ticket. Needed for ★5.'},
 partyhall:{name:'Party Hall',cat:'Leisure',w:22,h:2,cost:150000,star:3,venue:'party',ticket:120,capacity:50,upkeep:10000,desc:'Weekend events for up to 50 guests.'},
 security:{name:'Security Office',cat:'Services',w:12,cost:100000,star:2,pop:6,upkeep:20000,desc:'Guards rush to fires. Without them a fire burns out half a floor. Needed for ★3.'},
 housekeeping:{name:'Housekeeping',cat:'Services',w:12,cost:50000,star:2,pop:6,upkeep:15000,desc:'Six housekeepers clean hotel rooms after checkout and clear pests. Needed for ★3.'},
 medical:{name:'Clinic',cat:'Services',w:20,cost:500000,star:3,pop:10,upkeep:30000,desc:'Needed for ★4. Past 1,000 people, ratings slip without one.'},
 parking:{name:'Parking Bay',cat:'Services',w:4,cost:3000,star:2,basement:true,upkeep:200,desc:'Basement only. One bay per four offices and condos lifts their ratings.'},
 recycling:{name:'Recycling Center',cat:'Services',w:20,h:2,cost:500000,star:3,basement:true,upkeep:40000,desc:'Basement only. Needed for ★4. Past 2,500 people, trash drags every rating down.'},
 metro:{name:'Metro Station',cat:'Landmarks',w:30,h:2,cost:1000000,star:4,basement:true,upkeep:50000,desc:'Basement only. A second entrance that brings a third more visitors. Needed for ★5.'},
 skygarden:{name:'Sky Garden',cat:'Landmarks',w:40,h:2,cost:3000000,star:5,minF:75,upkeep:50000,desc:'Floor 76 or higher. The crown that earns Landmark status.'}

// ================= tiny heap =================
class Heap{constructor(){this.a=[];}

 push(e){const a=this.a;a.push(e);let i=a.length-1;while(i>0){const p=(i-1)>>1;if(a[p].t<=a[i].t)break;const x=a[p];a[p]=a[i];a[i]=x;i=p;}}
 pop(){const a=this.a,top=a[0],last=a.pop();if(a.length){a[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<a.length&&a[l].t<a[m].t)m=l;if(r<a.length&&a[r].t<a[m].t)m=r;if(m===i)break;const x=a[m];a[m]=a[i];a[i]=x;i=m;}}return top;}}

// ================= graph & routing =================
function rebuildGraph(){
 let id=0;R.segFloor=[0];
 for(let f=MINF;f<=MAXF;f++){const t=R.tile[FI(f)],s=R.seg[FI(f)];for(let c=0;c<COLS;c++){if(t[c]){if(c===0||!t[c-1]){id++;R.segFloor[id]=f;}s[c]=id;}else s[c]=0;}}
 R.segCount=id;
 const A0=[],A1=[];for(let i=0;i<=id;i++){A0.push([]);A1.push([]);}
 const add=(staffOnly,a,e)=>{e.fs=a;if(!staffOnly)A0[a].push(e);A1[a].push(e);};
 for(const u of S.units){const d=DEFS[u.type];if(!d.transit)continue;
  if(d.transit==='elev'){
   const mc=u.col+(u.w>>1),per=d.express?0.04:0.12;
   const stops=u.stops.filter(f=>f>=u.f&&f<=u.top);
   for(const a of stops){const sa=segAt(a,mc);if(!sa)continue;
    for(const b of stops){if(a===b)continue;const sb=segAt(b,mc);if(!sb)continue;add(d.staffOnly,sa,{u:u.id,k:'elev',from:a,to:b,seg:sb,cost:3+per*Math.abs(a-b)});}}
  }else{
   const sa=segAt(u.f,u.col),sb=segAt(u.f+1,u.col+u.w-1);
   if(sa&&sb){const cost=d.transit==='stairs'?3.2:1.6;
    add(false,sa,{u:u.id,k:d.transit,from:u.f,to:u.f+1,seg:sb,cost});
    add(false,sb,{u:u.id,k:d.transit,from:u.f+1,to:u.f,seg:sa,cost});}
  }
 }
 R.adj=[A0,A1];R.cache.clear();
 const ls=new Map(),t0=R.tile[FI(0)],s0=R.seg[FI(0)];
 for(let c=0;c<COLS;c++)if(t0[c]===2){const s=s0[c];if(!ls.has(s))ls.set(s,[]);ls.get(s).push(c);}
 R.lobbySegs=[...ls].map(([seg,cols])=>({seg,cols}));
 for(const g of [0,1]){const seen=new Set(),st=R.lobbySegs.map(l=>l.seg);st.forEach(s=>seen.add(s));
  while(st.length){const s=st.pop();for(const e of R.adj[g][s])if(!seen.has(e.seg)){seen.add(e.seg);st.push(e.seg);}}R.reach[g]=seen;}
 R.comm={food:[],shop:[],dine:[]};R.metros=[];
 for(const u of S.units){const d=DEFS[u.type];if(d.transit){u._unreach=false;continue;}
  const c=center(u),g=(u.type==='housekeeping'||u.type==='security')?1:0;
  u._unreach=!R.reach[g].has(segAt(c.f,c.c));
  if(d.comm)R.comm[d.comm].push(u);if(u.type==='metro')R.metros.push(u);}
 R.hasMetro=R.metros.some(m=>!m._unreach);
 R.dirty=false;
 for(const p of R.people){if(p.done)continue;
  if(p.st==='wait'||p.st==='walk'||p.needReroute){
   if(p.st==='wait'&&p.qarr){const i=p.qarr.indexOf(p);if(i>=0)p.qarr.splice(i,1);p.qarr=null;}
   p.needReroute=false;reroute(p);}}
}
function route(f1,c1,f2,c2,staff){
 if(R.dirty)rebuildGraph();
 const s1=segAt(f1,c1),s2=segAt(f2,c2);if(!s1||!s2)return null;if(s1===s2)return [];
 const key=(s1*65536+s2)*2+(staff?1:0);
 const hit=R.cache.get(key);if(hit!==undefined)return hit;
 const A=R.adj[staff?1:0],n=R.segCount+1,dist=new Float64Array(n).fill(Infinity),prev=new Array(n),done=new Uint8Array(n);
 dist[s1]=0;const h=new Heap();h.push({t:0,s:s1});
 while(h.size){const {t,s}=h.pop();if(done[s])continue;done[s]=1;if(s===s2)break;
  for(const e of A[s]){const nd=t+e.cost;if(nd<dist[e.seg]){dist[e.seg]=nd;prev[e.seg]=e;h.push({t:nd,s:e.seg});}}}
 let res=null;
 if(dist[s2]<Infinity){res=[];let s=s2;while(s!==s1){const e=prev[s];res.push(e);s=e.fs;}res.reverse();}

}
function lobbyPt(near){

 for(const L of segs){const c=L.cols[Math.floor(rnd()*L.cols.length)];if(!near||route(0,c,near.f,near.c,false)!==null)return {f:0,c};}

}

// ================= people =================
function entryX(L){const u=R.byId.get(L.u);if(!u)return null;if(L.k==='elev')return u.col+u.w/2;return L.to>L.from?u.col+0.5:u.col+u.w-0.5;}
function exitX(L,u){if(L.k==='elev')return u.col+u.w/2;return L.to>L.from?u.col+u.w-0.5:u.col+0.5;}
function setWalk(p){
 if(p.li<p.legs.length){const x=entryX(p.legs[p.li]);if(x===null){p.needReroute=true;p.tx=p.x;}else p.tx=x;}
 else p.tx=p.dest.c+0.5;
 p.st='walk';
}
function trip(o){
 if(!o.from||!o.to)return false;
 const legs=route(o.from.f,o.from.c,o.to.f,o.to.c,!!o.staff);
 if(legs===null){if(o.owner&&alive(o.owner))o.owner.eval=o.owner.eval*0.92;return false;}
 if(R.people.length>=MAXP){if(o.onArrive)o.onArrive();return true;}
 const p={id:R.pid++,f:o.from.f,x:o.from.c+0.5,legs,li:0,st:'walk',kind:o.kind,owner:o.owner||null,staff:!!o.staff,dest:o.to,onArrive:o.onArrive||null,wait:0,ride:0,walk:0,stairs:0,tx:0};
 setWalk(p);R.people.push(p);return true;
}
function reroute(p){
 const legs=route(p.f,Math.floor(p.x),p.dest.f,p.dest.c,p.staff);
 if(legs===null){p.done=true;if(p.owner&&alive(p.owner))p.owner.eval*=0.9;return;}
 p.legs=legs;p.li=0;setWalk(p);
}
function recordTrip(u,p){
 const s=p.wait/60+p.ride/60*0.15+p.walk/60*0.25+p.stairs*0.8;
 const score=clamp(100-s*5,0,100);
 u.eval=(u.eval??70)*0.85+score*0.15;
}
function finish(p){p.done=true;if(p.owner&&alive(p.owner))recordTrip(p.owner,p);if(p.onArrive)p.onArrive(p);}
function personStep(p){
 switch(p.st){
  case 'walk':{
   if(p.needReroute){p.needReroute=false;reroute(p);return;}
   const d=p.tx-p.x,sp=2;p.walk+=STEP;
   if(Math.abs(d)<=sp){p.x=p.tx;arrive(p);}else p.x+=Math.sign(d)*sp;
   break;}
  case 'wait':p.wait+=STEP;break;
  case 'ride':p.ride+=STEP;break;
  case 'stair':p.prog+=STEP;if(p.prog>=p.dur){const L=p.legs[p.li];p.f=L.to;p.x=p.exitX;p.li++;setWalk(p);}break;
 }
}
function arrive(p){
 if(p.li>=p.legs.length){finish(p);return;}
 const L=p.legs[p.li],u=R.byId.get(L.u);
 if(!u){p.needReroute=true;return;}
 if(L.k==='elev'){
  const rt=R.shaft.get(u.id);let q=rt.q.get(p.f);if(!q){q={u:[],d:[]};rt.q.set(p.f,q);}
  const arr=L.to>p.f?q.u:q.d;arr.push(p);p.qarr=arr;p.st='wait';
 }else{
  p.st='stair';p.prog=0;p.dur=(L.k==='stairs'?30:15);p.sx=p.x;p.exitX=exitX(L,u);p.stairs+=L.k==='stairs'?1:0.25;
 }
}

// ================= elevators =================
function shaftStep(u,rt){
 const d=DEFS[u.type],span=u.top-u.f+1;
 for(const car of rt.cars)car.assign.clear();
 for(const [fl,q] of rt.q){
  for(const dir of [1,-1]){const arr=dir>0?q.u:q.d;if(!arr.length)continue;
   let best=null,bc=1e9;
   for(const car of rt.cars){
    let c=Math.abs(car.f-fl);
    if(car.pax.length>=d.cap)c+=1e6;
    else if(car.dir!==0&&!(car.dir===dir&&(dir>0?car.f<=fl:car.f>=fl)))c+=span;
    if(c<bc){bc=c;best=car;}}
   if(best)best.assign.add(fl*2+(dir>0?1:0));}}
 for(const car of rt.cars)carStep(u,rt,car,d);
}
function beyond(car,dir){
 const f=car.f;
 for(const p of car.pax){const t=p.legs[p.li].to;if(dir>0?t>f:t<f)return true;}
 for(const k of car.assign){const fl=k>>1;if(dir>0?fl>f:fl<f)return true;}
 return false;
}
function isTarget(car,f){
 for(const p of car.pax)if(p.legs[p.li].to===f)return true;
 return car.assign.has(f*2)||car.assign.has(f*2+1);
}
function carStep(u,rt,car,d){
 car.pf=car.f;
 if(car.dwell>0){car.dwell-=STEP;return;}
 const fl=car.f;let acted=false;
 if(car.pax.length){const keep=[];
  for(const p of car.pax){if(p.legs[p.li].to===fl){p.f=fl;p.x=u.col+u.w/2;p.li++;setWalk(p);acted=true;}else keep.push(p);}
  car.pax=keep;}
 const q=rt.q.get(fl);
 const hasU=q&&q.u.length>0,hasD=q&&q.d.length>0;
 if(car.dir===0){
  if(hasU&&car.assign.has(fl*2+1))car.dir=1;else if(hasD&&car.assign.has(fl*2))car.dir=-1;
  else if(beyond(car,1))car.dir=1;else if(beyond(car,-1))car.dir=-1;
  else if(hasU)car.dir=1;else if(hasD)car.dir=-1;
 }else if(car.pax.length===0&&!beyond(car,car.dir)){
  const opp=-car.dir,sameQ=car.dir>0?hasU:hasD,oppQ=opp>0?hasU:hasD;
  if(!sameQ){if(oppQ||beyond(car,opp))car.dir=opp;else car.dir=0;}
 }
 if(q&&car.dir!==0){const arr=car.dir>0?q.u:q.d;
  while(arr.length&&car.pax.length<d.cap){const p=arr.shift();p.st='ride';p.qarr=null;car.pax.push(p);acted=true;}}
 if(acted){car.dwell=10;return;}
 if(car.dir===0)return;
 for(let k=0;k<d.speed;k++){const nf=car.f+car.dir;if(nf<u.f||nf>u.top){car.dir=0;break;}car.f=nf;if(isTarget(car,nf))break;}
}
function addCar(u){const d=DEFS[u.type];if(u.cars>=8)return flash('An elevator holds at most 8 cars.');if(S.money<d.carCost)return flash('Not enough money for another car.');
 S.money-=d.carCost;u.cars++;R.shaft.get(u.id).cars.push(newCar(u));renderPanel();}
function removeCar(u){if(u.cars<=1)return;const rt=R.shaft.get(u.id),car=rt.cars.pop();u.cars--;for(const p of car.pax){p.f=car.f;p.st='walk';p.needReroute=true;}R.dirty=true;renderPanel();}
function extendShaft(u,dir){
 const d=DEFS[u.type],f=dir>0?u.top+1:u.f-1;
 if(u.h+1>d.range)return flash(`This elevator already spans its maximum of ${d.range} floors.`);
 if(f>MAXFLOOR[S.star]||f<MINFLOOR[S.star])return flash(`At ★${S.star} you can only build between ${fname(MINFLOOR[S.star])} and ${fname(MAXFLOOR[S.star])}.`);
 for(let c=u.col;c<u.col+u.w;c++){
  if(egridAt(f,c))return flash(`A stairway or elevator on ${fname(f)} is in the way.`);
  if(!tileAt(f,c))return flash(`Build floor on ${fname(f)} first. The shaft needs room on every level.`);}
 if(S.money<d.perFloor)return flash('Not enough money to extend.');
 S.money-=d.perFloor;
 for(let c=u.col;c<u.col+u.w;c++)R.egrid[FI(f)][c]=u.id;
 if(dir>0)u.top=f;else u.f=f;u.h++;
 if(!d.express||expressFloor(f))u.stops.push(f);
 R.dirty=true;renderPanel();
}
function trimShaft(u,dir){
 if(u.h<=2)return flash('An elevator must span at least two floors.');
 const f=dir>0?u.top:u.f,rt=R.shaft.get(u.id);
 for(let c=u.col;c<u.col+u.w;c++)if(R.egrid[FI(f)][c]===u.id)R.egrid[FI(f)][c]=0;
 if(dir>0)u.top--;else u.f++;u.h--;
 u.stops=u.stops.filter(s=>s!==f);
 if(u.stops.length<2){u.stops=[];for(let s=u.f;s<=u.top;s++)if(!DEFS[u.type].express||expressFloor(s))u.stops.push(s);}
 for(const car of rt.cars){
  car.f=clamp(car.f,u.f,u.top);car.pf=car.f;
  const keep=[];for(const p of car.pax){if(p.legs[p.li].to===f||p.legs[p.li].to<u.f||p.legs[p.li].to>u.top){p.f=car.f;p.x=u.col+u.w/2;p.st='walk';p.needReroute=true;}else keep.push(p);}car.pax=keep;}
 const q=rt.q.get(f);if(q){for(const p of q.u.concat(q.d)){p.st='walk';p.qarr=null;p.needReroute=true;}rt.q.delete(f);}

}
function toggleStop(u,f){const d=DEFS[u.type];if(d.express&&!expressFloor(f))return;const i=u.stops.indexOf(f);
 if(i>=0){if(u.stops.length<=2)return flash('An elevator needs at least two stops.');u.stops.splice(i,1);}else u.stops.push(f);
 R.dirty=true;renderPanel();}

// ================= scheduling =================
function at(t,fn,fallback){if(t<S.time){if(fallback)fallback();return;}R.heap.push({t,fn});}
function dayStart(day){
 computePop();
 const base=day*DAY,we=day%3===2;
 for(const u of S.units){const d=DEFS[u.type];
  if(u.type==='office'){u._present=0;if(u.occ&&!we)schedOffice(u,base);}
  else if(u.type==='condo'){u._present=u.occ?3:0;if(u.occ)schedCondo(u,base,we);}
  else if(u.type==='housekeeping'){for(let i=0;i<6;i++){const go=()=>maidWork(u,center(u));at(base+rr(8,9.5)*HR,go,()=>{if(tod(S.time)<17*HR)at(S.time+rnd()*900,go);});}}
  else if(d.venue)schedVenue(u,base,we);
 }
 for(let hh=0;hh<24;hh++)at(base+hh*HR,()=>visitorsHour(day,hh));
 at(base+6*HR,morning);
 at(base+16.5*HR,hotelBooking);
 at(base+21*HR,fireRoll);
 at(base+22*HR,starCheck);
 at(base+23.5*HR,()=>dayEnd(day));
 at(base+DAY,()=>dayStart(day+1));
}
function leave(u,kind){if(!alive(u)||!u.occ||u._present<=0)return;const L=lobbyPt(center(u));if(!L)return;u._present--;trip({from:center(u),to:L,kind,owner:u});}
function comeHome(u,kind){if(!alive(u)||!u.occ)return;const L=lobbyPt(center(u));if(!L)return;trip({from:L,to:center(u),kind,owner:u,onArrive:()=>{if(alive(u))u._present++;}});}
function schedOffice(u,base){
 for(let i=0;i<6;i++){
  at(base+rr(7.5,9)*HR,()=>comeHome(u,'worker'),()=>{u._present++;});
  if(rnd()<0.6)at(base+rr(11.75,13)*HR,()=>outing(u,'worker',[['food',.75],['dine',.25]],rr(20,40)));
  at(base+rr(17,18.75)*HR,()=>leave(u,'worker'));
 }
}
function schedCondo(u,base,we){
 if(!we){
  for(let i=0;i<2;i++){
   at(base+rr(7,8.5)*HR,()=>leave(u,'resident'),()=>{u._present--;});
   at(base+rr(17.5,20)*HR,()=>comeHome(u,'resident'),()=>{u._present++;});
  }
  at(base+rr(10,15)*HR,()=>outing(u,'resident',[['shop',.6],['food',.4]],rr(30,60)));
 }else{
  for(let i=0;i<3;i++)if(rnd()<0.6)at(base+rr(11,18)*HR,()=>outing(u,'resident',[['shop',.45],['food',.3],['dine',.25]],rr(40,90)));
 }
}
function pickComm(cats){
 let tot=0;for(const c of cats)tot+=c[1];let r=rnd()*tot,cat=cats[0][0];
 for(const c of cats){if((r-=c[1])<0){cat=c[0];break;}}
 const ok=u=>u.occ&&alive(u)&&!u._unreach;
 let list=R.comm[cat].filter(ok);
 if(!list.length)for(const c of cats){list=R.comm[c[0]].filter(ok);if(list.length)break;}
 return list.length?list[Math.floor(rnd()*list.length)]:null;
}
function customer(u){u._custDay=(u._custDay||0)+1;}
function outing(u,kind,cats,stay){
 if(!alive(u)||u._present<=0)return;const t=pickComm(cats);if(!t)return;
 u._present--;
 const ok=trip({from:center(u),to:center(t),kind,owner:u,onArrive:()=>{customer(t);
  at(S.time+stay*60,()=>{if(!alive(u))return;if(!alive(t)){u._present++;return;}
   if(!trip({from:center(t),to:center(u),kind,owner:u,onArrive:()=>{if(alive(u))u._present++;}}))u._present++;});}});
 if(!ok)u._present++;
}
const VSHAPE=[0,0,0,0,0,0,0,.2,.4,.7,.9,1.4,1.6,1.2,1,1,1,1.1,1.3,1.2,.9,.5,.2,0],VSUM=VSHAPE.reduce((a,b)=>a+b,0);
function catsAt(h){if(h<11)return [['shop',.5],['food',.5]];if(h<14)return [['food',.65],['shop',.2],['dine',.15]];if(h<17)return [['shop',.6],['food',.25],['dine',.15]];if(h<22)return [['dine',.55],['food',.2],['shop',.25]];return [['food',1]];}
function visitorsHour(day,h){
 computePop();if(!VSHAPE[h])return;
 const we=day%3===2,total=(60+R.pop*0.4)*(we?1.6:1)*(R.hasMetro?1.35:1);
 const n=Math.min(500,Math.round(total*VSHAPE[h]/VSUM*rr(0.8,1.2)));
 for(let i=0;i<n;i++)at(S.time+rnd()*HR,()=>visitor(h));
}
function visitor(h){
 const t=pickComm(catsAt(h));if(!t)return;
 let from=null;if(R.hasMetro&&rnd()<0.3){const m=R.metros.find(m=>!m._unreach&&alive(m));if(m)from=center(m);}
 if(!from)from=lobbyPt(center(t));if(!from)return;
 const exit=from;
 trip({from,to:center(t),kind:'visitor',owner:t,onArrive:()=>{customer(t);at(S.time+rr(20,50)*60,()=>{if(alive(t))trip({from:center(t),to:exit,kind:'visitor'});});}});
}
function hotelBooking(){
 for(const u of S.units){const d=DEFS[u.type];
  if(!d.hotel||u.dirty||u.infest||u._booked||u._unreach)continue;
  const p=(0.3+0.08*S.star)*RENT_DEMAND[u.level]*(0.5+effEval(u)/200);
  if(rnd()<p){u._booked=true;u._in=0;u._pending=d.guests;u._stayed=false;
   for(let g=0;g<d.guests;g++)at(S.time+rr(0.5,4.5)*HR,()=>guestArrive(u));}}
}
function guestArrive(u){
 if(!alive(u))return;
 at((dayOf(S.time)+1)*DAY+rr(7,10)*HR,()=>guestOut(u));
 const L=lobbyPt(center(u));if(!L)return;
 trip({from:L,to:center(u),kind:'guest',owner:u,onArrive:()=>{if(!alive(u))return;u._in++;u._stayed=true;
  if(rnd()<0.45&&tod(S.time)<20.5*HR)at(S.time+rr(10,50)*60,()=>guestDinner(u));}});
}
function guestDinner(u){
 if(!alive(u)||u._in<=0)return;const t=pickComm([['dine',.8],['food',.2]]);if(!t)return;u._in--;
 const ok=trip({from:center(u),to:center(t),kind:'guest',owner:u,onArrive:()=>{customer(t);
  at(S.time+rr(45,80)*60,()=>{if(!alive(u))return;if(!alive(t)||!trip({from:center(t),to:center(u),kind:'guest',owner:u,onArrive:()=>{if(alive(u))u._in++;}}))u._in++;});}});
 if(!ok)u._in++;

function guestOut(u){
 if(!alive(u)||!u._booked)return;
 if(u._in>0){u._in--;const L=lobbyPt(center(u));if(L)trip({from:center(u),to:L,kind:'guest',owner:u});}
 u._pending--;

  if(u._stayed){earn(DEFS[u.type].nightly[u.level],'hotel');u.dirty=true;u.dirtyDay=dayOf(S.time);}
  u._booked=false;u._in=0;}
}
function claimRoom(pos){
 let best=null,bd=1e9;
 for(const u of S.units){if(!DEFS[u.type].hotel||!u.dirty||u._booked)continue;
  if(u._claim&&S.time-u._claim<4*HR)continue;if(u._nohk&&S.time-u._nohk<6*HR)continue;
  const d=Math.abs(u.f-pos.f)*10+Math.abs(u.col-pos.c)*0.1;if(d<bd){bd=d;best=u;}}

function maidWork(hk,pos){
 if(!alive(hk))return;
 if(tod(S.time)>=17*HR){const c=center(hk);if(pos.f!==c.f||Math.abs(pos.c-c.c)>2)trip({from:pos,to:c,kind:'maid',staff:true});return;}
 const room=claimRoom(pos);
 if(!room){at(S.time+1800,()=>maidWork(hk,pos));return;}
 room._claim=S.time;
 const ok=trip({from:pos,to:center(room),kind:'maid',staff:true,onArrive:()=>{
  if(!alive(room)){maidWork(hk,center(hk));return;}
  room._cleaning=true;
  at(S.time+(room.infest?7200:1800),()=>{if(alive(room)){room.dirty=false;room.infest=false;room._claim=0;room._cleaning=false;}maidWork(hk,center(room));});}});
 if(!ok){room._claim=0;room._nohk=S.time;at(S.time+3600,()=>maidWork(hk,pos));}

function schedVenue(u,base,we){
 const d=DEFS[u.type];u._present=0;

  for(let i=0;i<n;i++)at(showT-rr(10,60)*60,()=>{if(!alive(u))return;const L=lobbyPt(center(u));if(!L)return;
   trip({from:L,to:center(u),kind:'visitor',owner:u,onArrive:()=>{if(!alive(u))return;u._present++;earn(d.ticket,'venue');}});});
  at(showT+len,()=>{if(!alive(u))return;const k=u._present;u._present=0;
   for(let i=0;i<k;i++)at(S.time+rnd()*900,()=>{if(!alive(u))return;const L=lobbyPt(center(u));if(L)trip({from:center(u),to:L,kind:'visitor'});});});
 }

function morning(){
 const day=dayOf(S.time);
 for(const u of S.units){if(DEFS[u.type].hotel&&u.dirty&&!u.infest&&day-(u.dirtyDay??day)>=2){u.infest=true;notice(`Pests in a ${DEFS[u.type].name.toLowerCase()} on ${fname(u.f)}. Housekeeping will need two hours there.`,'warn',u);}}
 const inf=S.units.filter(u=>u.infest);
 for(const u of inf)for(const c of [u.col-1,u.col+u.w]){const n=R.byId.get(gridAt(u.f,c));
  if(n&&DEFS[n.type].hotel&&!n.infest&&!n._booked&&rnd()<0.3){n.infest=true;n.dirty=true;n.dirtyDay=n.dirtyDay??day;}}
}
function dayEnd(day){
 for(const u of S.units){const d=DEFS[u.type];if(d.comm&&u.occ)u.custAvg=(u.custAvg??d.need)*0.6+(u._custDay||0)*0.4;u._custDay=0;}
 fillVacancies();
 if((day+1)%3===0)quarterEnd(day);

}
function fillVacancies(){
 computePop();let n=0;
 for(const u of S.units){const d=DEFS[u.type];
  if(!isRental(u)||u.occ||u._unreach)continue;if(d.comm&&R.pop<d.minPop)continue;
  const base=u.type==='office'?0.45:u.type==='condo'?0.35:0.4;
  if(rnd()<base*RENT_DEMAND[u.level]*(0.6+0.1*S.star)){moveIn(u);n++;}}
 if(n)notice(`${n} new tenant${n>1?'s':''} signed tonight.`,'good');
}
function moveIn(u){const d=DEFS[u.type];u.occ=true;u.eval=70;
 if(u.type==='condo'){const p=d.sale[u.level];u.paid=p;earn(p,'condo');}
 if(d.comm)u.custAvg=d.need;}
function vacate(u){
 u.occ=false;if(u.type==='condo'&&u.paid){S.money-=u.paid;S.q.refund+=u.paid;}
 u.paid=0;u._present=0;
}
function quarterEnd(day){
 let rent=0,upkeep=0;const outs=[];
 for(const u of S.units){const d=DEFS[u.type];
  if((u.type==='office'||d.comm)&&u.occ)rent+=d.rent[u.level];
  if(d.upkeep)upkeep+=d.upkeep*(d.transit==='elev'?u.cars:1);}
 S.money+=rent-upkeep;S.q.rent+=rent;S.q.upkeep+=upkeep;
 for(const u of S.units)if(isRental(u)&&u.occ&&effEval(u)<30){vacate(u);outs.push(u);}
 const q=S.q;
 S.lastQ={label:qLabel(day),...q};
 notice(`${qLabel(day)} closed. Rent ${fmtK(q.rent)}, hotel ${fmtK(q.hotel)}, condo sales ${fmtK(q.condo)}, tickets ${fmtK(q.venue)}, upkeep −${fmtK(q.upkeep).slice(1)}${q.refund?`, refunds −${fmtK(q.refund).slice(1)}`:''}.`+(outs.length?` ${outs.length} unhappy tenant${outs.length>1?'s':''} left.`:''),outs.length?'warn':'good',outs[0]);
 S.q={rent:0,hotel:0,condo:0,venue:0,upkeep:0,refund:0};
}
function qLabel(day){return `Year ${Math.floor(day/12)+1} Q${Math.floor((day%12)/3)+1}`;}
function computePop(){
 let p=0,rentals=0,bays=0,rec=false,med=false;
 for(const u of S.units){const d=DEFS[u.type];
  if(d.pop&&(u.occ||!isRental(u)))p+=d.pop;
  if(d.hotel&&u._booked)p+=d.guests;
  if((u.type==='office'||u.type==='condo')&&u.occ)rentals++;
  if(u.type==='parking')bays++;if(u.type==='recycling')rec=true;if(u.type==='medical')med=true;}
 R.pop=p;R.parkBonus=rentals?Math.min(1,bays*4/rentals)*8:0;
 R.penalty=(p>=2500&&!rec?10:0)+(p>=1000&&!med?5:0);
}
function effEval(u){
 const d=DEFS[u.type];if(u._unreach)return 0;
 let e=(u.eval??70)+RENT_ADJ[u.level??1]-R.penalty;
 if(u.type==='office'||u.type==='condo')e+=R.parkBonus;
 if(d.comm){const a=u.custAvg??d.need;e=Math.min(e,clamp(a/d.need*75,0,100));}
 if(d.hotel&&u.infest)e-=30;
 return clamp(e,0,100);
}
function hasRating(u){const d=DEFS[u.type];return isRental(u)||d.hotel||d.venue;}
function avgEval(){let s=0,n=0;for(const u of S.units){const d=DEFS[u.type];if((isRental(u)&&u.occ)||d.hotel){s+=effEval(u);n++;}}return n?s/n:0;}
function towerTop(){return S.units.reduce((m,u)=>Math.max(m,u.f+u.h-1),0);}
function reqStatus(n){
 const r=REQ[n];if(!r)return null;computePop();const items=[];
 items.push({label:`Population ${R.pop.toLocaleString()} of ${r.pop.toLocaleString()}`,ok:R.pop>=r.pop});
 for(const t of r.has||[])items.push({label:`A working ${DEFS[t].name}`,ok:S.units.some(u=>u.type===t&&!u._unreach)});
 if(r.eval){const a=avgEval();items.push({label:`Average rating ${Math.round(a)} of ${r.eval}`,ok:a>=r.eval});}
 if(r.height){const t=towerTop();items.push({label:`Height ${fname(t)} of ${fname(r.height)}`,ok:t>=r.height});}
 return {items,ok:items.every(i=>i.ok)};
}
function starCheck(){
 if(S.star>=6)return;const st=reqStatus(S.star+1);
 if(st&&st.ok){S.star++;buildToolbar();notice(S.star===6?'Landmark status earned. The city looks up to you.':`The tower is now rated ${S.star} stars.`,'good');showStarModal();}

function fireRoll(){
 if(!S.cfg.fires||S.star<2||rnd()>0.05)return;
 const c=S.units.filter(u=>u.f>0&&!DEFS[u.type].transit);if(!c.length)return;

function startFire(u){
 u._fire=S.time;u._fireEnd=0;notice(`Fire in the ${DEFS[u.type].name.toLowerCase()} on ${fname(u.f)}!`,'bad',u);
 for(const s of S.units.filter(x=>x.type==='security'&&!x._unreach))for(let k=0;k<3;k++)
  trip({from:center(s),to:center(u),kind:'guard',staff:true,onArrive:()=>{
   if(alive(u)&&u._fire&&!u._fireEnd){u._fireEnd=S.time+900;at(u._fireEnd,()=>extinguish(u));}
   at(S.time+1200,()=>{if(alive(s)&&alive(u))trip({from:center(u),to:center(s),kind:'guard',staff:true});});}});

}
function extinguish(u){if(!alive(u))return;u._fire=0;u.eval=Math.max(0,(u.eval??70)-20);notice(`Security put out the fire on ${fname(u.f)}.`,'good',u);}
function burn(u){
 const f=u.f,lo=u.col-14,hi=u.col+u.w+14;
 const v=S.units.filter(x=>x.f<=f&&x.f+x.h-1>=f&&x.col+x.w>lo&&x.col<hi&&!DEFS[x.type].transit);

}

// ================= building =================
function hOf(type,f,top){const d=DEFS[type];return d.transit==='elev'?(top-f+1):(d.h||1);}
function check(type,f,col,top){
 const d=DEFS[type],w=d.w,h=hOf(type,f,top),res={ok:false,msg:'',cost:0,w,h,f,col};
 const fail=m=>{res.msg=m;return res;};
 if(d.star>S.star)return fail(`Unlocks at ★${d.star}.`);
 if(col<0||col+w>COLS)return fail('That runs off the lot.');
 const hi=f+h-1;
 if(hi>MAXFLOOR[S.star])return fail(`At ★${S.star} you can build up to ${fname(MAXFLOOR[S.star])}.`);
 if(f<MINFLOOR[S.star])return fail(MINFLOOR[S.star]===-1&&f<-1?`At ★${S.star} you can dig to B1.`:`At ★${S.star} you can dig to ${fname(MINFLOOR[S.star])}.`);
 if(type==='lobby'){if(!(f===0||(S.star>=3&&isSkyLobby(f))))return fail(S.star>=3?'Lobbies go on 1F, 15F, 30F, 45F, 60F, 75F, 90F or 99F.':'Lobbies go on the ground floor. Sky lobbies unlock at ★3.');}
 else if(!d.transit&&f<=0&&hi>=0)return fail('The ground floor is for the lobby.');
 if(d.basement&&hi>-1)return fail('Basement only.');
 if(d.minF&&f<d.minF)return fail(`Must sit on ${fname(d.minF)} or higher.`);
 if(d.transit==='elev'){
  if(h<2)return fail('Drag up or down to span at least two floors.');
  if(h>d.range)return fail(`Spans at most ${d.range} floors.`);
  if(d.express){let n=0;for(let ff=f;ff<=hi;ff++)if(expressFloor(ff))n++;if(n<2)return fail('An express must reach two lobby floors (1F, 15F, 30F…) or basements.');}
 }
 if((d.transit==='stairs'||d.transit==='esc')&&f+1>MAXFLOOR[S.star])return fail('Nothing above to connect to.');
 let newTiles=0;
 for(let ff=f;ff<=hi;ff++)for(let c=col;c<col+w;c++){
  if(d.transit){if(egridAt(ff,c))return fail(d.transit==='elev'?'Another elevator or stairway is already here.':'Another stairway or elevator is already here.');}
  else if(gridAt(ff,c))return fail('Something is already built here.');
  const t=tileAt(ff,c);
  if(d.tile){if(t===d.tile)return fail('Already built.');if(t===2)return fail('That’s lobby.');}
  else if(t===2&&!d.transit)return fail('You can’t build rooms on a lobby.');
  if(!t){
   if(d.transit==='elev')return fail(`An elevator needs a floor to stop at on each level. ${fname(ff)} has no floor here yet.`);
   if(d.transit)return fail('Stairs and escalators need floor to stand on.');
   newTiles++;
  }
 }
 if((d.transit==='stairs'||d.transit==='esc')&&!tileAt(f+1,col+w-1))return fail(`Needs floor on ${fname(f+1)} to land on.`);
 if(f>0){for(let c=col;c<col+w;c++)if(!tileAt(f-1,c))return fail('Needs floor directly underneath.');}
 else if(hi<0){for(let c=col;c<col+w;c++)if(!tileAt(hi+1,c))return fail('Basements hang from the floor above.');}
 let cost=d.cost+(d.perFloor?d.perFloor*h:0);
 if(!d.tile&&!d.transit)cost+=newTiles*500;
 if(S.money<cost)return fail(`Costs ${fmt(cost)}. You have ${fmt(S.money)}.`);
 res.ok=true;res.cost=cost;return res;
}
function place(type,f,col,top,quiet){
 const r=check(type,f,col,top);if(!r.ok){if(!quiet)flash(r.msg);return null;}
 const d=DEFS[type];S.money-=r.cost;
 if(d.tile){R.tile[FI(f)][col]=d.tile;R.dirty=true;return true;}
 const u={id:S.nextId++,type,f,col,w:d.w,h:r.h,level:1,eval:70,occ:!isRental({type})};
 if(d.transit==='elev'){u.top=f+r.h-1;u.cars=1;u.stops=[];for(let ff=f;ff<=u.top;ff++)if(!d.express||expressFloor(ff))u.stops.push(ff);}
 if(d.hotel)u.dirty=false;
 S.units.push(u);register(u);
 if(type==='housekeeping'&&tod(S.time)<16*HR)for(let i=0;i<6;i++)at(S.time+rnd()*1200,()=>maidWork(u,center(u)));
 return u;
}
function bulldozeAt(f,c,quiet){
 {const u=unitAt(f,c);if(u){removeUnit(u);return true;}}
 const t=tileAt(f,c);if(!t)return false;
 const blocked=(f>=0&&tileAt(f+1,c))||(f===0&&tileAt(-1,c))||(f<0&&tileAt(f-1,c));
 if(blocked){if(!quiet)flash(f>=0?'Clear the floor above first.':'Clear the basement below first.');return false;}
 R.tile[FI(f)][c]=0;R.dirty=true;return true;
}

// ================= simulation loop =================
function simStep(){
 S.time+=STEP;
 const h=R.heap;
 while(h.size&&h.peek().t<=S.time){const e=h.pop();try{e.fn();}catch(err){console.error(err);}}
 if(R.dirty)rebuildGraph();
 for(const [id,rt] of R.shaft){const u=R.byId.get(id);if(u)shaftStep(u,rt);}
 const P=R.people;for(let i=0;i<P.length;i++){const p=P[i];if(!p.done)personStep(p);}
 if(S.time%60===0){let j=0;for(let i=0;i<P.length;i++)if(!P[i].done)P[j++]=P[i];P.length=j;}
}

// ================= save / load =================
const SAVE_KEY='tall-order-save-v1';
function serialize(){
 const tiles={};
 for(let f=MINF;f<=MAXF;f++){const t=R.tile[FI(f)];if(!t.some(v=>v))continue;const runs=[];let c=0;
  while(c<COLS){const v=t[c];let n=1;while(c+n<COLS&&t[c+n]===v)n++;runs.push(v,n);c+=n;}tiles[f]=runs;}
 return JSON.stringify({v:1,S,tiles},(k,v)=>k[0]==='_'?undefined:v);
}
function deserialize(str){
 const data=JSON.parse(str);if(!data||data.v!==1||!data.S)throw new Error('Not a Tall Order save.');
 S=Object.assign(newState(),data.S);S.time=Math.round(S.time/STEP)*STEP;initRuntime();
 for(const f in data.tiles){const runs=data.tiles[f],t=R.tile[FI(+f)];let c=0;for(let i=0;i<runs.length;i+=2){t.fill(runs[i],c,c+runs[i+1]);c+=runs[i+1];}}
 for(const u of S.units)register(u);

function updateConfirm(){

function drawGhost(){
 const z=cam.z;
 if(dozeT){ctx.strokeStyle='#f06a5e';ctx.lineWidth=2.5/z;
  if(dozeT.u&&alive(dozeT.u)){const u=dozeT.u;ctx.fillStyle='rgba(240,106,94,.25)';ctx.fillRect(u.col*W,-(u.f+u.h)*H,u.w*W,u.h*H);ctx.strokeRect(u.col*W,-(u.f+u.h)*H,u.w*W,u.h*H);}
  else if(!dozeT.u)ctx.strokeRect(dozeT.c*W,-(dozeT.f+1)*H,W,H);}
 if(ghost){
  const g=ghost,G=ghostGeom(g);
  if(g.kind==='row'){for(let c=g.a;c<=g.b;c++){const ok=check(g.type,g.f,c,0).ok;ctx.fillStyle=ok?'rgba(134,217,147,.5)':'rgba(240,106,94,.35)';ctx.fillRect(c*W,G.y,W,H);}}
  else{const ok=ghostCheck(g).ok;ctx.fillStyle=ok?'rgba(134,217,147,.42)':'rgba(240,106,94,.38)';ctx.fillRect(G.x,G.y,G.w,G.h);}
  ctx.strokeStyle='#e9b44c';ctx.lineWidth=2/z;ctx.setLineDash([5/z,3/z]);ctx.strokeRect(G.x,G.y,G.w,G.h);ctx.setLineDash([]);
  for(const h of G.handles)drawHandle(h.x,h.y,h.id==='L'||h.id==='R'?'h':'v');
 }
 if(usedTouch&&!ghost&&sel&&alive(sel)&&isElev(sel)&&!(drag&&drag.mode==='resize'&&drag.moved))for(const h of gripGeom(sel))drawHandle(h.x,h.y,'v');
}
function drawHandle(x,y,dir){
 const z=cam.z,r=11/z;
 ctx.fillStyle='#f4f1e8';ctx.strokeStyle='#e9b44c';ctx.lineWidth=2.5/z;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.stroke();
 ctx.strokeStyle='#14181d';ctx.lineWidth=1.8/z;ctx.beginPath();
 if(dir==='h'){ctx.moveTo(x-5/z,y);ctx.lineTo(x+5/z,y);ctx.moveTo(x-5/z,y);ctx.lineTo(x-2/z,y-3/z);ctx.moveTo(x-5/z,y);ctx.lineTo(x-2/z,y+3/z);ctx.moveTo(x+5/z,y);ctx.lineTo(x+2/z,y-3/z);ctx.moveTo(x+5/z,y);ctx.lineTo(x+2/z,y+3/z);}
 else{ctx.moveTo(x,y-5/z);ctx.lineTo(x,y+5/z);ctx.moveTo(x,y-5/z);ctx.lineTo(x-3/z,y-2/z);ctx.moveTo(x,y-5/z);ctx.lineTo(x+3/z,y-2/z);ctx.moveTo(x,y+5/z);ctx.lineTo(x-3/z,y+2/z);ctx.moveTo(x,y+5/z);ctx.lineTo(x+3/z,y+2/z);}
 ctx.stroke();
}

function statusLine(u){

function showExport(){openModal(`<h1>Save code</h1><p>Copy this somewhere safe. Paste it back with “Load from code or file” on any device.</p><textarea id="exportTa" readonly>${esc(serialize())}</textarea><div class="btnrow"><button data-a="copy" class="on">Copy</button><button data-a="close">Done</button></div>`);}
function showImport(){openModal(`<h1>Load a tower</h1><p>Paste a save code, or choose a save file you kept.</p><textarea id="importTa" placeholder="Paste save code here"></textarea><div class="btnrow"><button data-a="paste" class="on">Load code</button><button data-a="file">Choose file…</button><button data-a="close">Cancel</button></div>`);}
function confirmNew(kind){openModal(`<h1>Start over?</h1><p>Your current tower will be replaced. Use “Copy save code” first if you want to keep it.</p><div class="btnrow"><button data-a="new-${kind}" class="on">${kind==='starter'?'New game with starter tower':'New game on empty lot'}</button><button data-a="close">Keep playing</button></div>`);}
function showHelp(){openModal(`<h1>Tall Order</h1>
<p>Build a skyscraper, keep its people moving, and climb from one star to Landmark.</p>
<h4>Build</h4><ul>
<li>Lay a <b>Lobby</b> along the ground floor. Everyone enters there.</li>
<li>Pick something in the toolbar and click to place it. Drag sideways for floors, lobby, and rows of rooms.</li>
<li>Elevators sit on top of the tower and pass straight through rooms. Drag <b>up or down</b> to lay one, then grab it near its top or bottom and drag to stretch or shrink it whenever you like.</li>
<li>Everything needs floor directly underneath. Basements hang from the floor above.</li></ul>
<h4>Keep people moving</h4><ul>
<li>Office workers, residents, guests, shoppers, housekeepers and guards each make real trips. Waiting figures turn <b>pink</b>, then <b>red</b>, as their patience wears out.</li>
<li>Click an elevator to add cars and choose which floors it stops at. Long waits drag down ratings.</li>
<li>Press <b>Ratings</b> to color units blue (good), yellow (fair), red (poor). Poor tenants move out when the quarter closes. Unhappy condo owners take their money back.</li></ul>
<h4>Money</h4><ul>
<li>Offices and shops pay rent each quarter (every three days). Condos sell once. Hotel rooms pay at checkout and need housekeeping before they rebook.</li>
<li>Shops need steady customers or they close. Elevators and services cost upkeep.</li></ul>
<h4>On a phone or tablet</h4><ul>
<li>One finger drags the view. Pinch to zoom, or use the <b>+ − ⌂</b> buttons.</li>
<li>Pick something to build, then tap where it should go. A ghost appears: drag it to move it, drag its round handles to resize, then tap <b>Build</b>. After a room, the ghost slides over so you can tap Build again for the next one.</li>
<li>Tap an elevator to select it, then drag its round handles to stretch it up or down.</li>
<li><b>☰</b> hides the build menu for more room.</li></ul>
<h4>Controls</h4><ul>
<li>Drag empty space (or right-drag, or hold <kbd>Space</kbd>) to pan. Scroll to move; <kbd>Ctrl</kbd>+scroll or pinch to zoom.</li>
<li><kbd>P</kbd> pause · <kbd>1</kbd>–<kbd>4</kbd> speed · <kbd>R</kbd> ratings · <kbd>B</kbd> demolish · <kbd>Esc</kbd> inspect.</li></ul>
<p>Click the stars at the top to see what the next rating needs. The game autosaves nightly in this browser.</p>
<div class="btnrow"><button data-a="close" class="on">Play</button></div>`);}
function showStarModal(){
 const unl=Object.entries(DEFS).filter(([,d])=>d.star===S.star).map(([,d])=>d.name);
 openModal(`<h1>${S.star>=6?'Landmark':S.star+' stars'}</h1><p>${S.star>=6?'Your tower is a landmark. Nothing left to unlock, so make it the best-run building in the city.':`You can now build up to ${fname(MAXFLOOR[S.star])} and down to ${fname(MINFLOOR[S.star])}.`}</p>${unl.length?`<h4>Unlocked</h4><ul>${unl.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>`:''}<div class="btnrow"><button data-a="close" class="on">Keep building</button></div>`);
}
function centerCam(){cam.z=VH<480?1.15:VW<700?1.1:1.6;cam.x=110*W-VW/cam.z/2;cam.y=-(5*H)-VH/cam.z*0.55;clampCam();}

// ================= main loop =================
let last=performance.now(),uiT=0,panelT=0;
function frame(now){
 const dt=Math.min(0.1,(now-last)/1000);last=now;
 if(speed>0&&modal.hidden){R.acc+=dt*BASE_RATE*speed/STEP;let n=Math.floor(R.acc);R.acc-=n;n=Math.min(n,80);for(let i=0;i<n;i++)simStep();}
 draw(speed>0?R.acc:1);
 uiT+=dt;panelT+=dt;
 if(uiT>0.2){uiT=0;updateTop();if(ghost||dozeT)updateConfirm();}
 if(panelT>0.8){panelT=0;if(!panelEl.hidden&&!panelEl.matches(':hover'))renderPanel();if(R.pop===undefined)computePop();}
 requestAnimationFrame(frame);
}
function start(data){
 resize();
 let loaded=false;
 if(data&&data.save){try{deserialize(data.save);loaded=true;if(data.cam)cam=data.cam;}catch(e){}}
 if(!loaded)loaded=loadSaved();
 if(!loaded){buildStarter();}
 buildToolbar();setSpeed(data&&typeof data.speed==='number'?data.speed:1);setTool('inspect');
 if(!(data&&data.cam))centerCam();
 computePop();updateTop();showTicker();checkRotate();
 let seen=false;try{seen=localStorage.getItem('tall-order-seen')==='1';localStorage.setItem('tall-order-seen','1');}catch(e){}
 if(!seen&&!loaded)showHelp();
 requestAnimationFrame(frame);
}
addEventListener('resize',resize);
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function'){try{window.claude.hot.snapshot(()=>({save:serialize(),cam,speed}));}catch(e){}}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

<script>
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
</body>
</html>
